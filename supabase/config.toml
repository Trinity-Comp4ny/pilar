# Alvo padrão dos comandos da CLI que aceitam --linked. Aponta para STAGING
# (rizaklgstyfrwgmdsldf) de propósito: até 2026-07-25 apontava para produção
# (vepnsonbnsimqcsfcagm), então um `supabase db push` digitado por reflexo, sem
# --db-url, aplicava migration não testada no banco dos clientes. Com staging como
# default, o mesmo erro cai num ambiente descartável. Ver ADR 0007.
# Produção só é alvo via `npm run db:push:prod` (exige ALLOW_PROD_DB_PUSH=true) ou
# pelo job deploy-production do CI, que passa --db-url/--project-ref explícitos.
project_id = "rizaklgstyfrwgmdsldf"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54342
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54334
smtp_port = 54335
pop3_port = 54336

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8082"
additional_redirect_urls = ["http://localhost:8082/**", "http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.rate_limit]
email_sent = 100
sms_sent = 100
token_verifications = 100
anonymous_users = 100

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.hook.send_email]
enabled = true
uri = "http://host.docker.internal:54331/functions/v1/auth-email-hook"
secrets = "env(AUTH_HOOK_SEND_EMAIL_SECRET)"

[functions.auth-email-hook]
enabled = true
verify_jwt = false
entrypoint = "./functions/auth-email-hook/index.ts"

[functions.portal-get-projeto]
verify_jwt = false

# ── Funções públicas / com autenticação própria ──────────────────────────────
# Estas NÃO validam o JWT do Supabase no gateway. A verdade de auth vive dentro
# de cada função (token do portal, assinatura de webhook, captcha, cron secret).
# Declarar aqui torna o deploy automatizado seguro: `supabase functions deploy`
# passa a respeitar estes flags — sem depender de `--no-verify-jwt` manual.

# Webhooks externos (não conseguem enviar JWT do Supabase)
[functions.asaas-webhook]
verify_jwt = false

[functions.pilar-checkout-webhook]
verify_jwt = false

[functions.pilar-checkout-create]
verify_jwt = false

[functions.pilar-checkout-status]
verify_jwt = false

# Cron (chamada agendada, sem usuário)
[functions.trial-expiry-cron]
verify_jwt = false

# Captcha pré-login (roda antes de existir sessão)
[functions.turnstile-verify]
verify_jwt = false

# Portal do cliente (auth própria via cliente_portal_accounts / portal token)
[functions.portal-aprovar-proposta]
verify_jwt = false

[functions.portal-entrega-download]
verify_jwt = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false
