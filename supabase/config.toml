project_id = "vepnsonbnsimqcsfcagm"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54342
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54334
smtp_port = 54335
pop3_port = 54336

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8082"
additional_redirect_urls = ["http://localhost:8082/**", "http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.rate_limit]
email_sent = 100
sms_sent = 100
token_verifications = 100
anonymous_users = 100

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.hook.send_email]
enabled = true
uri = "http://host.docker.internal:54331/functions/v1/auth-email-hook"
secrets = "env(AUTH_HOOK_SEND_EMAIL_SECRET)"

[functions.auth-email-hook]
enabled = true
verify_jwt = false
entrypoint = "./functions/auth-email-hook/index.ts"

[functions.portal-get-projeto]
verify_jwt = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false
