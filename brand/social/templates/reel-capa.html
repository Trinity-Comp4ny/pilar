<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>:root{--w:1080px;--h:1920px}.gz{position:absolute;left:0;right:0;background:rgba(204,34,34,.14);border:2px dashed #CC2222;color:#CC2222;font-size:30px;font-weight:500;display:flex;align-items:center;justify-content:center}.gz.top{top:0;height:240px}.gz.bot{bottom:0;height:240px}</style></head>
<body class="">
<div class="canvas" style="padding:330px 90px 330px">
<div class="dots"></div>
<span class="badge">{{badge}}</span>
<h1 class="hook" style="font-size:116px">{{hook_a}} <span class="pill">{{hook_pill}}</span></h1>
<div class="foot"><span class="who"><svg viewBox="0 0 27.6 22.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M.8 .8H26.8"/><path d="M2.8 4.8H24.8" stroke-opacity=".85"/><path d="M6.3 7.8V21.8"/><path d="M11.3 7.8V21.8"/><path d="M16.3 7.8V21.8"/><path d="M21.3 7.8V21.8"/></svg><span>{{brand}}</span></span><span>{{handle}}</span></div>

</body></html>
