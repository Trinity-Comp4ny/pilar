<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>:root{--w:1080px;--h:1350px}.q{font-size:240px;line-height:.7;font-weight:500;color:var(--ink);height:130px}.who2{display:flex;align-items:center;gap:26px;margin-top:56px;font-size:34px;line-height:1.3;color:var(--muted)}.who2 b{color:var(--ink);font-weight:500}.av{width:96px;height:96px;border-radius:50%;background:var(--brand);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:500}</style></head>
<body class="">
<div class="canvas"><div class="dots"></div>
<span class="badge">{{badge}}</span>
<div><div class="q">&ldquo;</div><p class="hook sm" style="margin-top:-10px">{{depoimento}}</p>
<div class="who2"><span class="av">{{iniciais}}</span><span><b>{{nome}}</b><br>{{cargo}}</span></div></div>
<div class="foot"><span class="who"><svg viewBox="0 0 27.6 22.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M.8 .8H26.8"/><path d="M2.8 4.8H24.8" stroke-opacity=".85"/><path d="M6.3 7.8V21.8"/><path d="M11.3 7.8V21.8"/><path d="M16.3 7.8V21.8"/><path d="M21.3 7.8V21.8"/></svg><span>{{brand}}</span></span><span>{{handle}}</span></div></div>
</body></html>
