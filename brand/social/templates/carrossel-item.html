<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>:root{--w:1080px;--h:1350px}.prog{display:flex;gap:12px}.prog i{flex:1;height:8px;border-radius:99px;background:var(--paper-200)}.prog i:nth-child(-n+2){background:var(--ink)}.num{font-size:260px;line-height:.9;font-weight:300;letter-spacing:-.05em;color:var(--ink);font-feature-settings:"tnum"}</style></head>
<body class="">
<div class="canvas">
<div><div class="prog"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<div><div class="num">{{n}}</div><h2 class="hook md" style="margin-top:10px">{{titulo}}</h2><p class="body" style="margin-top:44px">{{body}}</p></div>
<div class="foot"><span class="who"><svg viewBox="0 0 27.6 22.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M.8 .8H26.8"/><path d="M2.8 4.8H24.8" stroke-opacity=".85"/><path d="M6.3 7.8V21.8"/><path d="M11.3 7.8V21.8"/><path d="M16.3 7.8V21.8"/><path d="M21.3 7.8V21.8"/></svg><span>{{brand}}</span></span><span>{{handle}}</span></div></div>
