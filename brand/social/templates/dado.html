<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="social.css">
<style>:root{--w:1080px;--h:1350px}.big{font-size:178px;line-height:.95;font-weight:500;letter-spacing:-.05em;font-feature-settings:"tnum"}.conta{border-top:2px solid var(--line)}.conta div{display:flex;justify-content:space-between;padding:22px 0;border-bottom:2px solid var(--line);font-size:36px;color:var(--ink-soft);font-feature-settings:"tnum"}.conta b{font-weight:500;color:var(--ink)}.conta .t b{color:#BA1C1C}</style></head>
<body class="">
<div class="canvas"><div class="dots"></div>
<span class="badge">{{badge}}</span>
<div><div class="big">{{valor}}</div><p class="body" style="margin-top:28px;color:var(--ink);font-size:48px;line-height:1.25">{{legenda}}</p></div>
<div class="conta"><div><span>{{l1}}</span><b>{{v1}}</b></div><div><span>{{l2}}</span><b>{{v2}}</b></div><div class="t"><span>{{l3}}</span><b>{{v3}}</b></div></div>
<div class="foot"><span class="who"><svg viewBox="0 0 27.6 22.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M.8 .8H26.8"/><path d="M2.8 4.8H24.8" stroke-opacity=".85"/><path d="M6.3 7.8V21.8"/><path d="M11.3 7.8V21.8"/><path d="M16.3 7.8V21.8"/><path d="M21.3 7.8V21.8"/></svg><span>{{brand}}</span></span><span>{{handle}}</span></div></div>
</body></html>
