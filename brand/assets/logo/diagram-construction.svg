ze="13" font-weight="400" fill="#5F646D" text-anchor="start">capitel, ábaco e caneluras centrados em x = 14</text><text x="800.0" y="510.0" font-family="Geist, Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5F646D" text-anchor="start">u = unidade do desenho: 1u = altura do símbolo ÷ 22,6.</text></svg>
