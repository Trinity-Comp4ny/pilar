name: Playwright (browser + dependências de sistema, com cache)
description: >
  Deixa o headless shell do Chromium pronto para os specs, com cache do browser e dos
  pacotes de sistema. Usado pelos dois jobs de E2E do ci.yml (PR e staging). Exige
  node_modules instalado antes (setup-deps).

runs:
  using: composite
  steps:
    - name: Versão do Playwright
      id: pw
      shell: bash
      run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

    # Browser em cache por versão do Playwright. Só o headless shell (+ ffmpeg, para o
    # vídeo de falha), que é o que roda em headless: o Chromium completo nunca era
    # usado e dobrava o download.
    - id: browser
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell
    - if: steps.browser.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --only-shell chromium

    # Pacotes de sistema (.deb) em cache por imagem do runner: ImageOS e ImageVersion
    # são variáveis que o próprio runner define. Imagem nova (semanal) = cache novo,
    # e o primeiro run da semana paga o download uma vez.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/pw-apt
        key: pw-apt-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ steps.pw.outputs.version }}
    - name: Dependências de sistema do browser
      shell: bash
      run: PW_APT_CACHE="$HOME/.cache/pw-apt" scripts/ci-playwright-deps.sh
