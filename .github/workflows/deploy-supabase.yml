name: Deploy Supabase

# Deploy automatizado do backend (migrations + edge functions).
# Dispara SÓ depois que o workflow "CI" concluir com sucesso, mapeando:
#   staging → projeto Supabase de staging
#   main    → projeto Supabase de produção
#
# Substitui o processo manual (`supabase db push` + `functions deploy` no laptop).
# Os `verify_jwt` por função vivem em supabase/config.toml — `functions deploy`
# os respeita, então não precisamos mais de `--no-verify-jwt` à mão.
#
# Secrets necessários (por GitHub Environment: `staging` e `production`):
#   SUPABASE_ACCESS_TOKEN   — token de acesso (conta/org) do Supabase
#   SUPABASE_PROJECT_REF    — ref do projeto (ex.: vepnsonbnsimqcsfcagm)
#   SUPABASE_DB_URL         — URI do Session Pooler (IPv4) c/ senha embutida.
#                             Runners do GitHub são IPv4-only e a conexão direta
#                             do Supabase é IPv6-only → o pooler é obrigatório.
#                             Ex.: postgresql://postgres.<ref>:<senha>@aws-1-<regiao>.pooler.supabase.com:5432/postgres
# Ver docs/operations/STAGING_SETUP.md para o passo a passo.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, staging]

concurrency:
  group: deploy-supabase-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    # Só roda se o CI passou. Deploy direto sem CI verde é bloqueado.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # GitHub Environment: escopa os secrets e permite exigir aprovação em production.
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      # Faz checkout exatamente do commit que passou no CI (não do HEAD do branch).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations (db push via pooler IPv4)
        # `--db-url` aponta pro Session Pooler (IPv4). Sem isso o push tenta a
        # conexão direta (IPv6) e falha no runner IPv4-only do GitHub.
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy de todas as edge functions
        # Sem nome = deploy de todas as funções em supabase/functions,
        # respeitando verify_jwt de config.toml por função. Vai por HTTPS
        # (não usa a porta do banco), então IPv4 do runner basta.
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
