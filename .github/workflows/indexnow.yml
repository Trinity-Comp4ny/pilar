name: IndexNow (avisa Bing e outros buscadores)

# A publicação live do Firebase já envia o sitemap depois do smoke público.
# Use este workflow para reenviar manualmente quando necessário.
on:
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  indexnow:
    name: Enviar sitemap ao IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: apps/marketing/scripts
      - name: Enviar
        run: node apps/marketing/scripts/indexnow.mjs
