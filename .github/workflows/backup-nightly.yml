name: Backup noturno do banco

# Mitigação gratuita enquanto o projeto está no plano free da Supabase (sem
# backup automático, PITR desligado — ver docs/operations/DISASTER_RECOVERY.md).
# Não substitui PITR de verdade (não dá recovery point-in-time, só um snapshot
# por dia), mas é infinitamente melhor que zero backup, sem custo adicional.
#
# Cron/schedule só dispara a partir da branch DEFAULT (main) — mesma pegadinha
# que deixou o e2e-staging.yml sem rodar por meses. Depois de mergear em
# staging, este workflow só liga de verdade quando promovido pra main.

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 BRT, fora do horário de uso
  workflow_dispatch:

permissions:
  contents: read
  issues: write # abre issue quando o cron falha (notify-cron-failure)

env:
  SUPABASE_CLI_VERSION: "2.109.1"

jobs:
  backup:
    strategy:
      fail-fast: false
      matrix:
        # `environment` e `target` separados de propósito: o environment define
        # QUEM aprova, o target nomeia arquivo e artifact. Antes os dois eram o
        # mesmo campo, e foi isso que amarrou o backup ao gate humano.
        include:
          - environment: Staging
            target: Staging
          - environment: production-automation
            target: Production
    runs-on: ubuntu-latest
    # Environment com reviewer obrigatório PARA UM CRON é o mesmo que não ter o
    # cron: o job entra em `waiting` esperando um clique que ninguém dá às 3 da
    # manhã. Medido em 24/08: todo run desde 17/08 ficou `waiting` na perna de
    # produção (a de staging, sem gate, rodou liso), enquanto a issue #267
    # acumulava um comentário por noite. Com o PITR desligado no plano free, o
    # efeito real foi produção passar uma semana SEM BACKUP NENHUM.
    #
    # O gate humano fica onde faz sentido: no environment `Production`, que
    # guarda o deploy interativo. `production-automation` tem os mesmos segredos
    # e nenhum reviewer, e só cron aponta pra ele.
    environment: ${{ matrix.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # A CLI valida o config.toml inteiro antes de QUALQUER comando (mesmo
      # `db dump --db-url`, que não deveria precisar disso), e
      # [auth.hook.send_email] referencia env(AUTH_HOOK_SEND_EMAIL_SECRET) —
      # sem o secret no Environment, o parse aborta com "must be formatted as
      # v1,whsec_...". Achado real, 17/08 (mesmo padrão dos jobs de deploy do
      # ci.yml — db dump não aplica config no servidor, então um valor
      # descartável só pro parse passar é seguro).
      - name: Gerar secret descartável para o parse do config
        run: echo "AUTH_HOOK_SEND_EMAIL_SECRET=v1,whsec_$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # `supabase db dump` roda o pg_dump dentro de um container cuja versão a
      # CLI escolhe a partir de [db].major_version do config.toml (15, config
      # do Postgres LOCAL de dev) — mas staging/produção já estão em Postgres
      # 17 desde 13/07. Sem isto o dump aborta com "aborting because of server
      # version mismatch" (server 17.6, pg_dump 15.8). Editar só a cópia do
      # config.toml deste checkout efêmero do runner (nunca committed, nunca
      # toca o stack de dev local compartilhado entre sessões) resolve sem
      # trocar de ferramenta — pg_dump raw via libpq não aceita o mesmo
      # formato de connection string que SUPABASE_DB_URL usa (tentado e
      # revertido: "could not translate host name" por causa de como o
      # password é codificado na URI).
      - name: Ajustar major_version do config.toml só nesta run
        run: sed -i 's/^major_version = 15$/major_version = 17/' supabase/config.toml

      - name: Dump do banco (schema + dados)
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f dump.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Criptografar
        # AES-256-CBC simétrico com PBKDF2 (openssl já vem no runner). O dump em
        # texto puro nunca é escrito em disco além deste passo, nem sobe como
        # artifact — só o .enc.
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in dump.sql -out "dump-${{ matrix.target }}.sql.enc" \
            -k "$BACKUP_ENCRYPTION_KEY"
          rm -f dump.sql
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Upload do backup criptografado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backup-${{ matrix.target }}-${{ github.run_id }}
          path: dump-${{ matrix.target }}.sql.enc
          retention-days: 30

      # Sem isto, o cron pode quebrar em silêncio por semanas (mesma lição do
      # itau-sync/bradesco-sync) e o "backup" vira uma falsa sensação de segurança.
      - name: Notificar falha
        if: failure()
        uses: ./.github/actions/notify-cron-failure
        with:
          job-name: Backup noturno (${{ matrix.target }})
          token: ${{ github.token }}
