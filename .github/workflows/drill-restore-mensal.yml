name: Drill de restore (mensal)

# Prova todo mês que o backup de produção volta inteiro: baixa o último backup do
# backup-nightly.yml, restaura num Supabase vazio no próprio runner (Postgres 17, igual a
# produção) e compara linha por linha com o manifesto gravado no backup, além de RLS e
# funções de segurança (scripts/backup-restore-test.sh).
#
# Backup que nunca foi restaurado é suposição: foi assim que o noturno passou meses
# salvando só o schema (corrigido em 2026-10-09, ver DISASTER_RECOVERY.md).
#
# O dado de produção fica só no runner, que é descartado no fim. O relatório traz
# contagens e nomes de tabela, nunca conteúdo.
#
# Mesma pegadinha de todo `schedule`: só dispara a partir da branch default (main).

on:
  schedule:
    - cron: "0 9 1 * *" # dia 1, 06:00 BRT
  workflow_dispatch:
    inputs:
      gcs_run:
        description: "Opcional: RUN_ID-RUN_ATTEMPT da cópia no GCS. Vazio usa o último backup do GitHub."
        type: string
        required: false

permissions:
  contents: read
  actions: read # baixar o artifact do backup-nightly.yml
  issues: write # notify-cron-failure

env:
  SUPABASE_CLI_VERSION: "2.109.1"

jobs:
  gcs-source:
    name: Ler a cópia cifrada do GCS
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.gcs_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.artifact-id.outputs.name }}
      started_at: ${{ steps.clock.outputs.started_at }}
    environment: production-automation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Marcar início da recuperação pelo GCS
        id: clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar o identificador do backup e a configuração
        env:
          BACKUP_RUN: ${{ inputs.gcs_run }}
          GCS_BUCKET: ${{ vars.BACKUP_GCS_BUCKET }}
          GCS_READER: ${{ vars.BACKUP_GCS_RESTORE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ ! "$BACKUP_RUN" =~ ^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$ ]]; then
            echo "::error::Informe o identificador como RUN_ID-RUN_ATTEMPT."
            exit 1
          fi
          if [[ ! "$GCS_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ || -z "$GCS_READER" ]]; then
            echo "::error::Configure BACKUP_GCS_BUCKET e BACKUP_GCS_RESTORE_SERVICE_ACCOUNT."
            exit 1
          fi
      - name: Autenticar a identidade de leitura do bucket
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BACKUP_GCS_PROJECT_ID }}
          workload_identity_provider: ${{ vars.BACKUP_GCS_WIF_PROVIDER }}
          service_account: ${{ vars.BACKUP_GCS_RESTORE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: ">= 490.0.0"
      - name: Baixar e verificar os três objetos esperados
        env:
          BACKUP_RUN: ${{ inputs.gcs_run }}
          GCS_BUCKET: ${{ vars.BACKUP_GCS_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          directory="$RUNNER_TEMP/gcs-ciphertext"
          mkdir -p "$directory"
          for name in backup-Production.tar.gz.enc storage-Production.tar.gz.enc SHA256SUMS.txt; do
            gcloud storage cp --quiet "gs://$GCS_BUCKET/pilar/production/$BACKUP_RUN/$name" "$directory/$name"
          done
          node scripts/backup/verify-gcs-ciphertext.mjs "$directory"
      - id: artifact-id
        run: echo "name=gcs-ciphertext-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact-id.outputs.name }}
          path: ${{ runner.temp }}/gcs-ciphertext/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  drill:
    needs: [gcs-source]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.gcs_run == '' || needs.gcs-source.result == 'success') }}
    name: Restaurar o backup de produção
    runs-on: ubuntu-latest
    # Mesmo environment do backup noturno: tem a chave de criptografia e nenhum
    # reviewer (cron não espera clique). Ver comentário no backup-nightly.yml.
    environment: production-automation
    timeout-minutes: 30
    steps:
      - name: Marcar início da recuperação
        env:
          GCS_STARTED_AT: ${{ needs.gcs-source.outputs.started_at }}
        run: |
          set -euo pipefail
          started_at="${GCS_STARTED_AT:-$(date +%s)}"
          [[ "$started_at" =~ ^[0-9]{1,12}$ ]]
          echo "DRILL_STARTED_AT=$started_at" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # O dump vem do pg_dump 17, que usa \restrict; psql antigo não entende.
      - name: Instalar psql 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          psql --version

      # O artifact vem de outro run, então é dado não confiável até prova em contrário
      # (CodeQL actions/artifact-poisoning): só vale backup de run agendado na main (código
      # revisado), ele é baixado e extraído FORA do workspace, e só os quatro arquivos
      # esperados, regulares e sem caminho, chegam ao restore. Um artifact forjado não
      # consegue sobrescrever scripts do repositório nem rodar com os segredos deste job.
      - name: Baixar o backup de produção mais recente
        if: github.event_name != 'workflow_dispatch' || inputs.gcs_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow backup-nightly.yml --branch main --event schedule \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::Nenhum backup noturno agendado na main com sucesso nos últimos 30 dias."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/artifact"
          gh run download "$run_id" -n "backup-Production-$run_id" -D "$RUNNER_TEMP/artifact"
          # Os dois artifacts devem pertencer ao MESMO run bem-sucedido:
          # um dump restaurado sem os arquivos de obra não é recuperação completa.
          gh run download "$run_id" -n "storage-Production-$run_id" -D "$RUNNER_TEMP/artifact"
          echo "BACKUP_RUN=$run_id" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_run != ''
        with:
          name: ${{ needs.gcs-source.outputs.artifact_name }}
          path: ${{ runner.temp }}/artifact

      - name: Conferir a cópia cifrada recebida do GCS
        if: github.event_name == 'workflow_dispatch' && inputs.gcs_run != ''
        env:
          BACKUP_RUN: ${{ inputs.gcs_run }}
        run: |
          set -euo pipefail
          node scripts/backup/verify-gcs-ciphertext.mjs "$RUNNER_TEMP/artifact"
          echo "BACKUP_RUN=GCS $BACKUP_RUN" >> "$GITHUB_ENV"

      - name: Descriptografar e validar o conteúdo
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          # Opcional: a chave anterior, mantida durante a retenção (30 dias) depois de uma
          # rotação, para o drill ainda abrir artifacts cifrados com ela.
          BACKUP_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.BACKUP_ENCRYPTION_KEY_PREVIOUS }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/artifact"
          # Backups novos usam 600000 iterações de PBKDF2; os gerados até 14/10/2026 usam o
          # default do openssl (10000). Tenta chave atual e anterior, os dois formatos, e só aceita o que vira um tar válido
          # (CBC com iteração errada às vezes decifra "sem erro" para lixo), para o drill
          # continuar valendo durante os 30 dias de retenção.
          decifrado=0
          for chave in "$BACKUP_ENCRYPTION_KEY" "${BACKUP_ENCRYPTION_KEY_PREVIOUS:-}"; do
            [ -n "$chave" ] || continue
            for iter in "-iter 600000" ""; do
              # shellcheck disable=SC2086
              if openssl enc -d -aes-256-cbc -pbkdf2 $iter -in backup-Production.tar.gz.enc \
                   -k "$chave" -out backup.tar.gz 2>/dev/null \
                 && tar -tzf backup.tar.gz >/dev/null 2>&1; then
                decifrado=1
                break 2
              fi
            done
          done
          [ "$decifrado" = "1" ] || { echo "::error::Não foi possível decifrar o backup com nenhuma chave e formato conhecidos."; exit 1; }
          esperado=$'backup/\nbackup/data.sql\nbackup/manifesto.json\nbackup/roles.sql\nbackup/schema.sql'
          obtido=$(tar -tzf backup.tar.gz | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$obtido" != "$esperado" ]; then
            echo "::error::Conteúdo inesperado no backup:"
            echo "$obtido"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/restore"
          tar -xzf backup.tar.gz -C "$RUNNER_TEMP/restore" --no-same-owner --no-same-permissions
          find "$RUNNER_TEMP/restore/backup" -mindepth 1 ! -type f -print -quit | grep -q . \
            && { echo "::error::Backup com entrada que não é arquivo regular."; exit 1; }
          echo "BACKUP_DIR=$RUNNER_TEMP/restore/backup" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/restore/backup"

      # Descriptografa SOMENTE em diretório efêmero, sem extrair fotos, documentos
      # ou áudios: a auditoria lê o tar como stream, valida caminhos, tipo,
      # unicidade, manifesto, contagens, tamanhos e SHA-256 de cada objeto.
      # Exige o Storage do MESMO run do dump para evitar falso DR verde.
      - name: Verificar integridade do backup do Storage (sem extrair)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.BACKUP_ENCRYPTION_KEY_PREVIOUS }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/artifact"
          test -s storage-Production.tar.gz.enc || {
            echo "::error::Backup criptografado do Storage ausente ou vazio."
            exit 1
          }
          decifrado=0
          for chave in "$BACKUP_ENCRYPTION_KEY" "${BACKUP_ENCRYPTION_KEY_PREVIOUS:-}"; do
            [ -n "$chave" ] || continue
            for iter in "-iter 600000" ""; do
              # Formato antigo sem iter explícito só é aceito para retrocompatibilidade.
              # shellcheck disable=SC2086
              if openssl enc -d -aes-256-cbc -pbkdf2 $iter \
                   -in storage-Production.tar.gz.enc -k "$chave" -out storage-restore.tar.gz 2>/dev/null \
                 && tar -tzf storage-restore.tar.gz >/dev/null 2>&1; then
                decifrado=1
                break 2
              fi
            done
          done
          [ "$decifrado" = "1" ] || {
            echo "::error::Não foi possível decifrar o backup de Storage."
            exit 1
          }
          python3 "$GITHUB_WORKSPACE/scripts/backup/verify_storage_archive.py" storage-restore.tar.gz \
            | tee storage-drill.log
          {
            echo "### Integridade do Storage: backup do run $BACKUP_RUN"
            echo '```'
            cat storage-drill.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # Projeto Supabase vazio, fora do repositório: sem as migrations do app, o restore
      # cria tudo a partir do schema do backup, como seria num desastre de verdade.
      - name: Subir um Supabase vazio (Postgres 17)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drill" && cd "$RUNNER_TEMP/drill"
          supabase init --force
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          # Mesmas versões de Auth e Storage de produção: o dump traz tabelas e colunas que
          # esses serviços criam lá, e o Supabase gerenciado atualiza antes do CLI. Sem isto
          # o restore falha em "auth.<tabela> does not exist" ou "storage.buckets.<coluna>
          # does not exist". O CLI lê os arquivos de supabase/.temp (os mesmos do `supabase
          # link`) e usa o valor como tag da imagem, por isso o "v".
          mkdir -p supabase/.temp
          auth=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/health?services=auth" \
            | jq -r '.[0].info.version // empty')
          storage=$(curl -fsS "https://$SUPABASE_PROJECT_REF.supabase.co/storage/v1/version")
          if [ -z "$auth" ] || [ -z "$storage" ]; then
            echo "::error::Sem a versão de Auth ou Storage de produção (auth='$auth' storage='$storage')."
            exit 1
          fi
          echo "Produção: Auth $auth, Storage $storage"
          printf 'v%s' "${auth#v}" > supabase/.temp/gotrue-version
          printf 'v%s' "${storage#v}" > supabase/.temp/storage-version
          supabase start -x studio,imgproxy,inbucket,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Restaurar e conferir
        run: |
          set -euo pipefail
          ./scripts/backup-restore-test.sh "$BACKUP_DIR" "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            | tee drill.log
          {
            echo "### Drill de restore: backup do run $BACKUP_RUN"
            echo '```'
            sed -n '/DR drill/,$p' drill.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restaurar arquivos e conferir a leitura pelo Storage local
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/artifact/storage-restore.tar.gz"
          recuperado=$(mktemp -d "$RUNNER_TEMP/storage-drill.XXXXXX")
          trap 'rm -rf -- "$recuperado"; rm -f -- "$archive"' EXIT
          # O tar acabou de passar pela validação de caminhos, tipos e manifesto.
          tar -xzf "$archive" -C "$recuperado" --no-same-owner --no-same-permissions
          SUPABASE_DRILL_SERVICE_ROLE_KEY=$(
            cd "$RUNNER_TEMP/drill"
            supabase status -o json | jq -er '.SERVICE_ROLE_KEY | select(type == "string" and length > 0)'
          )
          echo "::add-mask::$SUPABASE_DRILL_SERVICE_ROLE_KEY"
          export SUPABASE_DRILL_SERVICE_ROLE_KEY
          inicio=$SECONDS
          node scripts/storage-backup.mjs drill "$recuperado/storage-backup" | tee storage-restore.log
          {
            echo "### Restauração do Storage"
            cat storage-restore.log
            echo "Upload e releitura concluídos em $((SECONDS - inicio)) s."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar tempo total e resultado da recuperação
        if: ${{ always() && env.DRILL_STARTED_AT != '' }}
        env:
          DRILL_STATUS: ${{ job.status }}
          DRILL_SOURCE: ${{ inputs.gcs_run != '' && 'GCS' || 'GitHub Actions' }}
        run: |
          set -euo pipefail
          agora=$(date +%s)
          duracao=$((agora - DRILL_STARTED_AT))
          {
            echo "### Tempo da recuperação no runner"
            echo "- Origem: $DRILL_SOURCE"
            echo "- Resultado: $DRILL_STATUS"
            echo "- Tempo decorrido: ${duracao} s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notificar falha
        if: failure()
        uses: ./.github/actions/notify-cron-failure
        with:
          job-name: Drill de restore (mensal)
          token: ${{ github.token }}
      - name: Fechar a issue de falha (voltou a passar)
        if: success()
        uses: ./.github/actions/notify-cron-failure
        with:
          job-name: Drill de restore (mensal)
          token: ${{ github.token }}
          status: success
