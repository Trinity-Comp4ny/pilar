name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Dispatch manual para exercitar os gates numa branch sem abrir PR. Atenção: o
  # GitHub só oferece o dispatch quando o workflow já existe na branch DEFAULT, e
  # hoje o ci.yml de main é uma versão antiga sem este gatilho. Ou seja, isto passa
  # a funcionar depois que staging chegar em main (é a mesma pegadinha que deixou o
  # e2e-staging.yml sem nunca rodar). Os jobs de deploy têm `if` de push em branch
  # específica, então dispatch nunca deploya.
  workflow_dispatch:

# Permissão mínima no topo, nenhum job eleva.
permissions:
  contents: read

env:
  # Pinada, não `latest`: com `latest` a action consulta a API do GitHub a cada job
  # para descobrir a release, e isso derrubou o job de banco com "Failed to resolve
  # latest Supabase CLI release: rate limit exceeded". Além do flake, `latest` torna o
  # build irreprodutível — o mesmo commit passa hoje e falha amanhã porque a CLI mudou.
  # Bumpar aqui, num lugar só, deliberadamente.
  SUPABASE_CLI_VERSION: "2.109.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Desenho do gate de PR (reescrito em 10/11/2026):
  #
  # - Tudo que é independente roda em paralelo, um job por pergunta. Antes, lint,
  #   typecheck, testes e build eram um job só de ~13 min: um erro de tipo PULAVA os
  #   testes, e só se descobria o próximo erro no run seguinte.
  # - A suíte do Vitest (509 arquivos) roda em 8 shards; o job `coverage` junta os
  #   relatórios e aplica os pisos de cobertura do vite.config.ts sobre a soma.
  # - O E2E roda em 3 shards, cada um com o PRÓPRIO Supabase local (banco isolado,
  #   sem disputa de dado entre specs). O stack sobe em segundo plano enquanto o
  #   Node e o Playwright instalam.
  # - node_modules e os browsers do Playwright vêm de cache.
  # - PR que só mexe em documentação roda o scan de segredo e pula o resto.
  # ---------------------------------------------------------------------------

  # Decide se o PR toca código. Só PR pode ser "só docs": push em staging/main e
  # dispatch rodam tudo, porque é deles que sai deploy.
  changes:
    name: Escopo da mudança
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.escopo.outputs.code }}
      unit: ${{ steps.escopo.outputs.unit }}
      e2e: ${{ steps.escopo.outputs.e2e }}
      db: ${{ steps.escopo.outputs.db }}
      functions: ${{ steps.escopo.outputs.functions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Em PR o checkout é o merge commit (refs/pull/N/merge): HEAD^1 é a ponta da
          # base, então HEAD^1..HEAD é exatamente o que o PR muda. Profundidade 2 basta.
          fetch-depth: 2
      # CI seletivo: cada grupo de checks roda só se o PR mexe no que ele verifica
      # (regras e o porquê de cada uma em scripts/ci-escopo.sh). Arquivo desconhecido
      # liga tudo. Em 10/11, 52% dos commits só mexiam em teste unitário e não
      # precisavam de E2E, banco nem Edge Functions.
      #
      # Push em staging/main e dispatch rodam TUDO: é de lá que sai deploy, e é a rede
      # de segurança do que um PR pulou (falha em staging abre issue sozinha).
      - id: escopo
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" != "pull_request" ]; then
            printf '%s\n' code=true unit=true e2e=true db=true functions=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARQUIVOS="$(git diff --name-only HEAD^1 HEAD)"
          echo "::group::Arquivos do PR"; printf '%s\n' "$ARQUIVOS"; echo "::endgroup::"
          ESCOPO="$(printf '%s\n' "$ARQUIVOS" | scripts/ci-escopo.sh)"
          echo "$ESCOPO" >> "$GITHUB_OUTPUT"
          {
            echo "### Escopo do PR"
            echo ""
            echo "| Grupo | Roda? |"
            echo "|---|---|"
            echo "$ESCOPO" | sed -E 's/^([a-z]+)=true$/| \1 | ✅ |/; s/^([a-z]+)=false$/| \1 | ⏭️ pulado (nada que ele verifica mudou) |/'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$ESCOPO"

  # Merge em staging é por rebase: cada commit do PR entra no histórico como está.
  # Reprova wip, fixup!/squash! esquecido e assunto fora do padrão convencional.
  # Fora de PR (push, dispatch) não há "commits do PR": passa direto.
  commits:
    name: Commits do PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: scripts
      - name: Conferir mensagens
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMITS_JSON="$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" | jq -s 'add')"
          export COMMITS_JSON
          scripts/check-commits-pr.sh

  lint:
    name: Lint + formatação
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
      - run: npm run lint
      - name: Prettier (formatação)
        # O lint-staged formata no commit, mas commit com --no-verify (ou de bot)
        # passava sem formatar: em 10/11 havia 18 arquivos fora do padrão em src/.
        run: npm run format:check

  typecheck:
    name: Typecheck (app + LP)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
      - name: Typecheck do app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck da LP (apps/marketing)
        # A LP não tinha nenhum gate de tipo: só o deploy da Vercel buildava, e
        # `vite build` não confere tipo.
        run: npm run typecheck:marketing

  unit-tests:
    name: Testes unitários (${{ matrix.shard }}/8)
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Todos os shards terminam mesmo se um falhar: o objetivo é ver TODA falha
      # num run só, não a primeira.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
      - name: Vitest (shard ${{ matrix.shard }}/8, com cobertura)
        # O relatório blob carrega resultado e cobertura do shard; o job `coverage`
        # junta os 4. 39% do tempo da suíte é subir jsdom por arquivo (medido em
        # 10/11), e isso só cai dividindo arquivos entre máquinas: pool threads não
        # muda nada e --no-isolate quebra 62 arquivos.
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/8 --reporter=blob --reporter=dot
        env:
          # O piso de cobertura vale para a soma dos shards, não para cada um (ver
          # vite.config.ts e o job `coverage`).
          VITEST_SHARD_SEM_PISO: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          # Pasta padrão do blob reporter no Vitest 5 (não é mais .vitest-reports).
          path: .vitest/blob/
          # .vitest começa com ponto: sem isto o upload ignora a pasta.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Junta os 8 shards e aplica os pisos de cobertura (thresholds do vite.config.ts)
  # sobre o total. Piso por shard não faria sentido: cada um vê só 1/8 dos testes.
  coverage:
    name: Piso de cobertura
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - name: Juntar shards e conferir o piso
        # A trava dos 4 arquivos é porque um merge com shard faltando reprovaria pelo
        # piso, mas com uma mensagem enganosa ("cobertura caiu") em vez de "faltou shard".
        run: |
          set -euo pipefail
          N=$(ls .vitest/blob/blob-*-8.json | wc -l)
          if [ "$N" -ne 8 ]; then
            echo "::error::Esperava 8 relatórios de shard, chegaram $N."
            exit 1
          fi
          npx vitest run --merge-reports=.vitest/blob --coverage --reporter=dot

  build:
    name: Build (app + LP) + Knip + bundle
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
      - name: Código morto não cresce (Knip)
        # Catraca: knip-baseline.json guarda a contagem de 07/10 e só pode cair.
        run: npm run check:dead-code
      - run: npm run build
      - name: Bundle size budget
        run: npm run check:bundle-size
      - name: Build da LP (apps/marketing)
        run: npm run build:marketing

  audit:
    name: Security audit
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `npm audit` lê só o package-lock.json: não precisa de node_modules (antes o
      # job gastava ~50 s de `npm ci` para um comando de 1 s).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm audit --audit-level=high --omit=dev
      # SBOM (CycloneDX) das dependências de produção: o inventário que um cliente ou
      # auditor pede depois de um CVE ("estou afetado?"). Guardado a cada push em
      # staging e main, ou seja, um por release. Este sim lê a árvore instalada
      # (`--package-lock-only` reprova por peer deps inválidas), então só instala no push.
      - if: github.event_name == 'push'
        uses: ./.github/actions/setup-deps
      - name: Gerar SBOM (CycloneDX)
        if: github.event_name == 'push'
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - name: Guardar SBOM
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  # Roda em todo PR, inclusive o "só docs": segredo vaza em doc tanto quanto em código.
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # 8.21.2 tinha um bug real: um [[allowlists]] só por path não suprimia
          # achado em dist/ (só passou a funcionar em versão mais nova), então o
          # scanner acusava o bundle buildado como se fosse segredo novo. Testado
          # localmente com 8.21.2 vs 8.30.1 antes de subir a versão.
          GITLEAKS_VERSION=8.30.1
          # Baixa para arquivo, com retry: o download de release do GitHub às vezes
          # devolve uma página de erro, e no pipe direto para o tar isso virava
          # "gzip: stdin: not in gzip format" (scan nem rodava; PR #748, 08/11).
          # -f faz o curl falhar com o status HTTP em vez de entregar o HTML ao tar.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner --verbose

  # Banco: aplica as migrations do zero e roda pgTAP.
  # Sobe o stack completo do Supabase via CLI (não a imagem supabase/postgres crua),
  # porque foi exatamente isso que matou o job de pgTAP anterior em f5a86ea: sem
  # GoTrue e Storage, auth.uid() e storage.buckets não existem e o schema nunca casa.
  #
  # A sincronia de types.ts é avaliada aqui (o stack já está de pé) mas o veredito sai
  # como OUTPUT, não como falha do job. Motivo: types.ts fora de sync é problema de DX,
  # não diz nada sobre a migration ser segura de aplicar. Quando este job era o único e
  # falhava por causa dos tipos, o deploy de staging era skipado, e como types.ts só
  # pode ser regenerado DEPOIS da migration chegar ao banco, o pipeline ficava preso
  # num círculo (aconteceu no run 30177061938). Quem reprova por tipos é o job
  # types-sync abaixo, que fica fora do needs do deploy.
  database:
    name: Migrations + RLS
    needs: [changes]
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      types_in_sync: ${{ steps.types.outputs.in_sync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # O guard compara com a base do PR, então precisa do histórico.
          fetch-depth: 0
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # O config.toml tem `[auth.hook.send_email] secrets = env(AUTH_HOOK_SEND_EMAIL_SECRET)`,
      # e a CLI valida o formato antes de subir qualquer coisa: sem a var, `supabase
      # start` aborta com "must be formatted as v1,whsec_<base64>". Gera um valor
      # descartável aqui em vez de hardcodar (hardcode viraria achado do gitleaks, e
      # com razão). Não é segredo: o stack é local e efêmero.
      - name: Gerar secret descartável para o parse do config
        run: echo "AUTH_HOOK_SEND_EMAIL_SECRET=v1,whsec_$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # Produção e staging rodam Postgres 17; o config.toml do repo fixa 15 porque é o
      # stack LOCAL de dev (volume de dados em PG15, compartilhado entre sessões e
      # worktrees). Trocar o config quebraria o dev de todo mundo, então só a cópia do
      # checkout deste runner sobe em 17: migrations e pgTAP passam a ser provados na
      # mesma versão major de produção (mesmo padrão do backup-nightly.yml).
      - name: Alinhar o Postgres do stack com produção (17)
        run: sed -i 's/^major_version = 15$/major_version = 17/' supabase/config.toml

      # Em segundo plano: o pull das imagens (~1 min) corre junto com a instalação do
      # Node e o guard. Fora Studio (a maior imagem, ~360 MB), edge-runtime e
      # imgproxy, que nem migration nem pgTAP usam. GoTrue, Storage e Realtime ficam:
      # criam os schemas auth/storage/realtime que as migrations referenciam.
      - name: Subir o stack local (em segundo plano)
        run: |
          # `|| rc=$?`: o bash do Actions roda com -e, e sem isto uma falha mataria o
          # subshell antes de gravar o exit code. O redirect do subshell inteiro solta o
          # stdout do passo (senão o runner espera o processo em segundo plano).
          # scripts/ci-wait-supabase.sh espera o .rc e mostra o log.
          ( rc=0
            supabase start -x studio,edge-runtime,imgproxy > "$RUNNER_TEMP/supabase-start.log" 2>&1 || rc=$?
            echo "$rc" > "$RUNNER_TEMP/supabase-start.rc" ) > /dev/null 2>&1 &

      - uses: ./.github/actions/setup-deps

      # Antes de tocar em qualquer banco: nenhuma migration nova apaga dado sem
      # autorização explícita. Barato e é o achado mais caro.
      - name: Guard de migration destrutiva
        env:
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ vars.ALLOW_DESTRUCTIVE_MIGRATION }}
          # Em PR: a branch de destino. Em push: o commit ANTERIOR ao push, que é
          # literalmente "o que este push acrescentou".
          #
          # Antes daqui usava-se `staging` fixo em push, e isso reprovava todo
          # release em main (visto em 25/08, run 32838892456): `A...B` resolve pelo
          # MERGE BASE, e como main e staging divergiram de propósito (cada release
          # é um squash), o merge base fica muito atrás e o guard reanalisava
          # migrations antigas, acusando um DROP COLUMN já revisado e já aplicado.
          # O efeito não era só o X vermelho: `CI OK` e o deploy de produção viravam
          # `skipped`, então o release não chegava em produção e parecia ter chegado.
          #
          # Pior efeito de segundo nível: a saída era ligar
          # ALLOW_DESTRUCTIVE_MIGRATION em TODO release, ou seja, criar rotina de
          # desligar a proteção. Guard que grita sempre deixa de ser guard.
          BASE_REF_PR: ${{ github.base_ref }}
          ANTES_DO_PUSH: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "pull_request" ]; then
            # actions/checkout não cria remote-tracking ref das outras branches nem
            # com fetch-depth 0, então busca a base antes de comparar.
            git fetch --no-tags origin "$BASE_REF_PR"
            BASE=FETCH_HEAD
          else
            BASE="$ANTES_DO_PUSH"
            # Branch nova, force-push ou histórico raso: cai no pai do HEAD, que é a
            # melhor aproximação disponível de "antes deste push".
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "::notice::github.event.before indisponível ($BASE); comparando com HEAD^."
              BASE="HEAD^"
            fi
          fi
          echo "Comparando migrations novas contra: $BASE"
          node scripts/check-migration-safety.mjs --base "$BASE"

      - name: Esperar o stack local
        run: scripts/ci-wait-supabase.sh

      - name: Aplicar todas as migrations do zero
        # Prova que a fila inteira de migrations funciona num banco vazio, não só por
        # acidente do estado atual de produção.
        run: supabase db reset --no-seed

      - name: Rodar os testes pgTAP de RLS
        # A extensão vive no schema extensions (mesma convenção do CONTRIBUTING).
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54332 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
          supabase test db

      - name: Avaliar sincronia de types.ts
        id: types
        # Não reprova o job: grava o veredito para o job types-sync decidir.
        #
        # Duas armadilhas que faziam este gate acusar diferença onde não há nenhuma, e
        # que só apareceram quando ele rodou de verdade (PR #142):
        #
        # 1. O gerado ia para /tmp, e o prettier resolve .prettierrc relativo ao
        #    ARQUIVO, não ao cwd. Um lado saía com printWidth 120 (o do projeto) e o
        #    outro com o default 80, então o diff era quase todo quebra de linha. Por
        #    isso os dois temporários agora ficam dentro do repo e o --config é explícito.
        # 2. __InternalSupabase.PostgrestVersion difere entre o stack local do CLI e o
        #    projeto hospedado. É versão de runtime, não schema. normalize-db-types.mjs
        #    corta esse bloco (e tem teste garantindo que não corta mais que isso).
        run: |
          supabase gen types typescript --local > ./types-gate-local-raw.ts
          node scripts/normalize-db-types.mjs ./types-gate-local-raw.ts > ./types-gate-local.ts
          node scripts/normalize-db-types.mjs src/integrations/supabase/types.ts > ./types-gate-committed.ts
          npx prettier --config .prettierrc --parser typescript ./types-gate-local.ts > ./types-gate-a.ts
          npx prettier --config .prettierrc --parser typescript ./types-gate-committed.ts > ./types-gate-b.ts
          if diff -u ./types-gate-b.ts ./types-gate-a.ts; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            echo "::warning::types.ts está fora de sync com as migrations (o job types-sync vai reprovar)."
          fi

  # Check próprio para a sincronia de tipos, separado do deploy de propósito (ver o
  # comentário do job database). Bloqueia merge, não bloqueia aplicar migration.
  types-sync:
    name: types.ts em sync
    needs: [database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir veredito
        env:
          IN_SYNC: ${{ needs.database.outputs.types_in_sync }}
        run: |
          if [ "$IN_SYNC" != "true" ]; then
            echo "::error::src/integrations/supabase/types.ts está fora de sync com as migrations. Rode 'npm run gen:types' e commite. O diff está no log do job Migrations + RLS."
            exit 1
          fi
          echo "types.ts em sync."

  # Edge Functions Deno não tinham nenhuma verificação de compilação: erro de
  # sintaxe ou import quebrado só aparecia no cold start, em produção.
  edge-functions:
    name: Edge Functions (deno check)
    needs: [changes]
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v1.45.x # acompanha o runtime que o Supabase executa hoje
      # Cachear os módulos remotos resolvidos: sem isto, todo run baixa tudo de novo
      # do esm.sh, e um 5xx de lá reprova o gate sem haver nada errado no código (foi
      # o que aconteceu no run 30176697516). A chave inclui os imports das funções,
      # então mudar dependência invalida o cache. Com a chave exata, o `deno check`
      # leva ~0 s: o cache de checagem do Deno sabe que aquele grafo já passou.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: deno check (com ratchet de dívida)
        run: scripts/deno-check.sh
        shell: bash
      - name: deno test
        # As Edge Functions não tinham NENHUM teste (46 funções, 0 cobertura — achado
        # da triagem Sentry de 02/09, invite-user órfão ao falhar o envio). Começa pelo
        # que reproduz bug real já visto em produção: assinatura do webhook de e-mail
        # (auth-email-hook/webhook.ts) e fallback de provider (lookup-cep/providers.ts).
        # Mesmo comando de `npm run test:functions`, chamado direto porque este job não
        # tem Node instalado. --no-check porque deno-check.sh (acima) já cobre tipo com
        # o ratchet de dívida; este step é só comportamento.
        # --allow-read: o teste de fronteira do módulo de e-mail (ADR 0039) varre os
        # arquivos das functions para reprovar HTML de e-mail fora de _shared/email/.
        run: deno test --no-check --allow-env --allow-read supabase/functions
        shell: bash

  # E2E do app contra um Supabase LOCAL, em todo PR. Antes daqui o Playwright só
  # rodava depois do merge (job e2e, contra staging): um botão quebrado entrava em
  # staging e só então alguém descobria. Aqui o banco nasce das migrations do próprio
  # PR e o seed cria o usuário de teste, então não há secret, não há dado compartilhado
  # e não há como sujar staging. Mesmo comando do dev: `npm run test:e2e:local`.
  #
  # Em 3 shards, cada um com o seu Supabase: os specs mutam o seed (aprovar aditivo é
  # definitivo), então dividir por máquina é seguro e subir workers no mesmo banco não.
  # A regressão visual roda só no shard 1 (ver scripts/e2e-local.sh).
  e2e-local:
    name: E2E (Playwright, Supabase local, ${{ matrix.shard }}/3)
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Mesmo motivo do job database: sem a var, o parse do config.toml aborta.
      - name: Gerar secret descartável para o parse do config
        run: echo "AUTH_HOOK_SEND_EMAIL_SECRET=v1,whsec_$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      # Mesmo motivo do job database: só a cópia deste runner sobe em PG 17.
      - name: Alinhar o Postgres do stack com produção (17)
        run: sed -i 's/^major_version = 15$/major_version = 17/' supabase/config.toml
      # Em segundo plano, aplicando as migrations do PR, enquanto Node e Playwright
      # instalam. Só o Studio fica de fora: o resto (inclusive edge-runtime e
      # imgproxy) é o app de verdade que os specs exercitam.
      - name: Subir o stack local em segundo plano (aplica as migrations do PR)
        run: |
          # `|| rc=$?`: o bash do Actions roda com -e, e sem isto uma falha mataria o
          # subshell antes de gravar o exit code. O redirect do subshell inteiro solta o
          # stdout do passo (senão o runner espera o processo em segundo plano).
          # scripts/ci-wait-supabase.sh espera o .rc e mostra o log.
          ( rc=0
            supabase start -x studio > "$RUNNER_TEMP/supabase-start.log" 2>&1 || rc=$?
            echo "$rc" > "$RUNNER_TEMP/supabase-start.rc" ) > /dev/null 2>&1 &

      # node 22: o auth.setup.ts cria um client Supabase, que exige WebSocket nativo.
      - uses: ./.github/actions/setup-deps

      # Browser e pacotes de sistema em cache (.github/actions/setup-playwright). O
      # `install-deps` oficial rodava apt-get update + install todo run, mesmo com nada
      # faltando: 1m26 a 2m09, o passo mais lento do caminho crítico em 10/11.
      - uses: ./.github/actions/setup-playwright

      - name: Esperar o stack local
        run: scripts/ci-wait-supabase.sh
      - name: Specs do app (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e:local
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
          # "1" regrava as referências da regressão visual em vez de comparar. Só
          # ligar num PR para atualizar a referência (e2e/visual/README.md).
          E2E_VISUAL_ATUALIZAR: ""
      - name: Referências da regressão visual
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && matrix.shard == 1 }}
        with:
          name: screenshots-visual-${{ github.run_id }}
          path: e2e/visual/telas.visual.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-local-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Único required status check do branch protection. Adicionar ou renomear job
  # deixa de exigir mexer na configuração do repositório.
  #
  # `always()` é o que faz este gate valer. Sem ele, quando QUALQUER job acima falhava,
  # este ficava "skipped", e o GitHub conta job skipped como sucesso em required check:
  # o PR vermelho ficava mergeável (visto no run 42688785280, typecheck falhou e o
  # CI OK saiu skipped). Agora ele roda sempre e reprova se algo não passou. "skipped"
  # só é aceito para um job cujo grupo o escopo do PR desligou (scripts/ci-escopo.sh).
  #
  # Note que o conjunto que bloqueia MERGE (aqui) é maior que o que bloqueia DEPLOY
  # (abaixo). São perguntas diferentes: "esta mudança está boa para entrar?" inclui
  # sincronia de tipos e E2E; "é seguro aplicar no banco?" não.
  ci-ok:
    name: CI OK (aggregate gate)
    needs: [changes, commits, lint, typecheck, unit-tests, coverage, build, audit, secrets-scan, database, types-sync, edge-functions, e2e-local]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir todos os gates
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          # Grupo de cada job (scripts/ci-escopo.sh). "skipped" só é aceito quando o
          # grupo do job estava desligado para este PR; em qualquer outro caso (job
          # pulado porque uma dependência falhou, por exemplo) o gate reprova.
          GRUPOS: >-
            {"lint":"code","typecheck":"code","build":"code","audit":"code",
             "unit-tests":"unit","coverage":"unit",
             "database":"db","types-sync":"db",
             "edge-functions":"functions","e2e-local":"e2e"}
          ESCOPO: >-
            {"code":"${{ needs.changes.outputs.code }}","unit":"${{ needs.changes.outputs.unit }}",
             "e2e":"${{ needs.changes.outputs.e2e }}","db":"${{ needs.changes.outputs.db }}",
             "functions":"${{ needs.changes.outputs.functions }}"}
        run: |
          set -euo pipefail
          FALHAS=$(jq -rn --argjson r "$RESULTADOS" --argjson g "$GRUPOS" --argjson e "$ESCOPO" '
            $r | to_entries
            | map(select(.value.result != "success"
                         and ((.value.result == "skipped"
                               and ($g[.key] // "") != ""
                               and $e[$g[.key]] == "false") | not)))
            | map("\(.key) = \(.value.result)") | join("; ")')
          # Tabela no resumo do run: um olhar diz o que falhou e o que o escopo pulou.
          {
            echo "### Gates do CI"
            echo ""
            echo "| Gate | Resultado |"
            echo "|---|---|"
            jq -rn --argjson r "$RESULTADOS" --argjson g "$GRUPOS" --argjson e "$ESCOPO" '
              $r | to_entries[]
              | "| \(.key) | \(if .value.result == "success" then "✅ passou"
                             elif .value.result == "skipped" and ($g[.key] // "") != "" and $e[$g[.key]] == "false"
                               then "⏭️ fora do escopo do PR"
                             elif .value.result == "skipped" then "❌ pulado"
                             elif .value.result == "cancelled" then "⚪ cancelado"
                             else "❌ \(.value.result)" end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FALHAS" ]; then
            echo "::error::Gates que não passaram: $FALHAS"
            exit 1
          fi
          echo "Todos os gates do escopo deste PR passaram."

  # Deploy do backend no Supabase de STAGING.
  # Roda como job do próprio CI (gatilho push do branch staging), então se
  # registra a partir do branch staging e NÃO depende do arquivo estar no main
  # (a pegadinha do workflow_run, que só liga a partir do branch default).
  # Secrets no GitHub Environment "Staging": SUPABASE_ACCESS_TOKEN,
  # SUPABASE_DB_URL (Session Pooler IPv4), SUPABASE_PROJECT_REF.
  deploy-staging:
    name: Deploy → staging (Supabase)
    # Deliberadamente NÃO depende de ci-ok, e sim dos gates que dizem algo sobre a
    # segurança de tocar o banco. types-sync fica fora: exigir types.ts em sync para
    # aplicar migration cria um deadlock, porque types.ts só pode ser regenerado
    # depois que a migration está no banco.
    needs: [lint, typecheck, unit-tests, coverage, build, audit, secrets-scan, database, edge-functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Staging
    # Dois pushes seguidos não podem aplicar migration ao mesmo tempo, e cancelar
    # um db push no meio é pior que esperar o anterior terminar.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # A CLI valida o config.toml inteiro em db push / functions deploy, e o bloco
      # [auth.hook.send_email] referencia env(AUTH_HOOK_SEND_EMAIL_SECRET). Sem essa
      # var o parse aborta antes de aplicar migration. NENHUM destes comandos aplica
      # config no servidor (db push = migrations; functions deploy = código), então
      # isto é só para o parse passar. O hook real vive no GoTrue do projeto.
      AUTH_HOOK_SEND_EMAIL_SECRET: ${{ secrets.AUTH_HOOK_SEND_EMAIL_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Aplicar migrations (db push via pooler IPv4)
        # --db-url aponta pro Session Pooler (IPv4). A conexão direta do Supabase
        # é IPv6-only e falharia no runner IPv4-only do GitHub.
        # --include-all aplica também migrations com timestamp MENOR que a última já
        # no remoto. Necessário quando um hotfix cherry-picked deixa uma versão alta no
        # topo do schema_migrations (ex.: 20260725000000 em prod) e o release traz
        # migrations anteriores a ela. Sem a flag o push aborta com "found local
        # migrations before the last migration on remote".
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Deploy das edge functions
        # Sem nome = deploya todas em supabase/functions, respeitando verify_jwt
        # de config.toml por função. Vai por HTTPS, IPv4 do runner basta.
        # Com retry: o bundle resolve os imports remotos na hora, e um 5xx do esm.sh
        # derruba o deploy sem haver nada errado no código (run 30288891918 morreu com
        # "Import 'https://esm.sh/@supabase/supabase-js@2' failed: 522"). O wrapper só
        # repete em erro de transporte; erro de bundle real falha na primeira.
        # --use-api empacota no servidor do Supabase, sem puxar a imagem do edge-runtime
        # do Docker Hub: o runner compartilhado estourava "toomanyrequests: Data limit
        # exceeded" por horas, e o retry de 45s não adianta contra esse limite (runs
        # 39307383109 e 39315007872 em staging).
        run: scripts/retry-on-network-error.sh supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Marcar release nas edge functions (health + Sentry)
        # Sem isso, health/index.ts e _shared/sentry.ts caem no fallback "unknown"/
        # undefined pra sempre: nenhum workflow setava RELEASE_SHA nem SENTRY_RELEASE
        # nos secrets do projeto. `secrets set` é global ao projeto (não precisa de
        # redeploy) e vale pro próximo cold start de cada function.
        # SENTRY_ENV separa staging de produção no Sentry (sem isto, _shared/sentry.ts
        # cai no default "production" pros dois projetos Supabase, ver ADR 0036).
        run: supabase secrets set RELEASE_SHA="$GITHUB_SHA" SENTRY_RELEASE="$GITHUB_SHA" SENTRY_ENV="staging" --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Smoke test (health)
        # Deploy verde precisa significar "responde", não só "aplicou".
        # health não está declarado em config.toml, então exige JWT: usa a anon key.
        # Sem o secret no Environment o script falha (SMOKE_OBRIGATORIO), em vez de
        # passar em silêncio: o secret existe em staging e produção desde 14/10.
        # O retry vive no script: propagação das functions passa dos 20s (ver o
        # comentário em scripts/smoke-health.sh).
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
          SMOKE_OBRIGATORIO: "true"
        run: scripts/smoke-health.sh

  # E2E contra o staging recém-deployado. Vive AQUI, e não num workflow próprio, pelo
  # mesmo motivo do deploy: `workflow_run` só se registra a partir da branch DEFAULT, e
  # foi essa armadilha que deixou o e2e-staging.yml sem NUNCA rodar (o gatilho dele
  # apontava para "Deploy Supabase", workflow deletado em bd77a39).
  #
  # Fora do ci-ok de propósito: roda depois do deploy, muta dados em staging, e não faz
  # sentido bloquear merge com ele. Falha aqui é sinal para investigar staging, não para
  # impedir uma entrada.
  e2e:
    name: E2E → staging (Playwright)
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Staging
    env:
      CI: "true"
      # O Playwright builda o front e sobe `npm run preview` local (ver
      # playwright.config.ts), apontando para o Supabase de STAGING.
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # admin-e2e@pilar.test tem MFA obrigatório (mesma regra de qualquer admin em
      # staging/produção, PrivateRoute.tsx). Fator TOTP cadastrado de verdade via API
      # (17/08); auth.setup.ts gera o código a cada login (ver src/lib/totp.ts).
      E2E_TEST_TOTP_SECRET: ${{ secrets.E2E_TEST_TOTP_SECRET }}
      E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
      E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 22: e2e/auth.setup.ts cria um client Supabase, e o construtor sempre
      # inicializa o RealtimeClient, que exige WebSocket nativo (Node 22+). Achado real,
      # 17/08: os specs autenticados quebravam aqui antes mesmo do login.
      - uses: ./.github/actions/setup-deps
      # Mesmo cache de browser e pacotes do E2E de PR: antes, `install --with-deps`
      # baixava Chromium completo + apt-get a cada push em staging (até 3m44).
      - uses: ./.github/actions/setup-playwright
      - run: npm run build

      # A empresa do usuário de E2E fica sempre ativa, sem depender do relógio do
      # trial (venceu em 31/08 e bloqueou o app por um mês). Mesmo secret do deploy.
      - name: Garantir fixture do usuário de E2E
        if: env.E2E_TEST_EMAIL != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/e2e-staging-fixture.sql

      # Specs que não dependem de login (landing, login-validation, portal-cliente,
      # security...). O de acessibilidade do site de marketing saiu deste passo (ver
      # o último passo abaixo).
      - name: Specs sem autenticação
        run: npx playwright test --project=chromium
        env:
          # Um relatório por passo: com a pasta padrão, cada `playwright test`
          # apagava o relatório do anterior e o artifact só tinha o último passo.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/sem-login

      # `!cancelled()`: os specs logados rodam mesmo se um spec sem login falhar.
      # Sem isso, de set. a out./2026 um único spec vermelho (a11y da landing) fez
      # este passo ser PULADO em todo push, e dois specs logados apodreceram sem
      # ninguém ver (botão "Nova Receita" que deixou de existir; limite de trial).
      - name: Specs autenticados
        if: ${{ !cancelled() && env.E2E_TEST_EMAIL != '' }}
        run: npx playwright test --project=authenticated
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/autenticados
      - name: Aviso quando o usuário de teste não está provisionado
        if: env.E2E_TEST_EMAIL == ''
        run: echo "::warning::E2E_TEST_EMAIL/E2E_TEST_PASSWORD ausentes no Environment Staging, então os specs autenticados foram pulados. Crie o usuário de teste em staging e adicione os secrets."

      # Acessibilidade do site de marketing EM PRODUÇÃO (www.pilarsoft.com.br). Não
      # depende deste commit, mas é o único lugar que mede a landing no ar. Ficou
      # informativo de set. a out./2026 por uma falha que era do próprio teste (a
      # emulação de movimento reduzido nunca ligava; ver e2e/marketing-a11y.spec.ts).
      # Corrigido, volta a reprovar o job.
      - name: Acessibilidade do site de marketing
        if: ${{ !cancelled() }}
        run: npx playwright test --project=marketing
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/marketing

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # O sinal único de "staging validado": CI completo + deploy com smoke de health + E2E
  # contra o ambiente, todos no mesmo commit. É o que o promote staging → main confere
  # (promote-staging-to-main.yml). `always()` para ficar VERMELHO quando algo antes falhou,
  # em vez de "skipped", que some na lista de checks.
  staging-ready:
    name: Staging Ready
    needs: [ci-ok, deploy-staging, e2e]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issues: write só aqui, para abrir/fechar a issue "Pipeline quebrado: staging".
    permissions:
      contents: read
      issues: write
    steps:
      - name: CI, deploy (com smoke) e E2E de staging verdes neste commit
        id: veredito
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          FALTA=$(echo "$RESULTADOS" | jq -r 'to_entries | map(select(.value.result != "success") | "\(.key) = \(.value.result)") | join("; ")')
          # Falha de verdade vs. run cancelado: o concurrency do CI cancela o run
          # anterior a cada push novo em staging, e cancelamento não é "staging
          # quebrado". Só falha real abre issue; o check fica vermelho nos dois casos.
          FALHOU=$(echo "$RESULTADOS" | jq -r '[.[] | select(.result == "failure")] | length > 0')
          echo "falta=$FALTA" >> "$GITHUB_OUTPUT"
          echo "falhou=$FALHOU" >> "$GITHUB_OUTPUT"
          if [ -n "$FALTA" ]; then
            echo "::error::Staging não está pronto em ${GITHUB_SHA:0:8}: $FALTA"
            exit 1
          fi
          echo "::notice::Staging pronto em ${GITHUB_SHA:0:8}."

      # Antes, um deploy ou E2E de staging vermelho depois do merge ficava só como um
      # X na aba Actions: ninguém era avisado. Agora vira issue (uma só, que acumula
      # comentários) e fecha sozinha no primeiro push verde.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ !cancelled() && (success() || steps.veredito.outputs.falhou == 'true') }}
        with:
          sparse-checkout: .github/actions
      - name: Abrir issue de staging quebrado
        if: ${{ failure() && steps.veredito.outputs.falhou == 'true' }}
        uses: ./.github/actions/notify-cron-failure
        with:
          job-name: staging
          title-prefix: Pipeline quebrado
          details: "Gates que não passaram: ${{ steps.veredito.outputs.falta }}"
          token: ${{ github.token }}
      - name: Fechar a issue de staging quebrado
        if: success()
        uses: ./.github/actions/notify-cron-failure
        with:
          job-name: staging
          title-prefix: Pipeline quebrado
          status: success
          token: ${{ github.token }}

  # Deploy do backend em PRODUÇÃO. DORMENTE até este ci.yml chegar no branch main:
  # só dispara em push no main (github.ref) E o job precisa existir no arquivo do
  # branch onde o push ocorre. Em staging nunca roda (o if barra). Espelha o
  # deploy-staging, mas com o GitHub Environment "Production", que exige aprovação.
  deploy-production:
    name: Deploy → production (Supabase)
    # Mesmo conjunto do deploy-staging, pelo mesmo motivo. O gate humano de produção é
    # o required reviewer do Environment "Production", não a sincronia de tipos.
    needs: [lint, typecheck, unit-tests, coverage, build, audit, secrets-scan, database, edge-functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # A CLI valida o config.toml inteiro antes de aplicar, e [auth.hook.send_email]
      # referencia env(AUTH_HOOK_SEND_EMAIL_SECRET). O secret não estava no Environment
      # Production, então o parse abortava com "must be formatted as v1,whsec_...". Como
      # db push/functions deploy NÃO aplicam config no servidor (só migrations/código),
      # gera um valor descartável só para o parse passar, igual o job "Migrations + RLS".
      # O hook real vive no GoTrue do projeto e não é tocado aqui.
      - name: Gerar secret descartável para o parse do config
        run: echo "AUTH_HOOK_SEND_EMAIL_SECRET=v1,whsec_$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Aplicar migrations (db push via pooler IPv4)
        # --include-all aplica também migrations com timestamp MENOR que a última já
        # no remoto. Necessário quando um hotfix cherry-picked deixa uma versão alta no
        # topo do schema_migrations (ex.: 20260725000000 em prod) e o release traz
        # migrations anteriores a ela. Sem a flag o push aborta com "found local
        # migrations before the last migration on remote".
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Deploy das edge functions
        # Com retry: o bundle resolve os imports remotos na hora, e um 5xx do esm.sh
        # derruba o deploy sem haver nada errado no código (run 30288891918 morreu com
        # "Import 'https://esm.sh/@supabase/supabase-js@2' failed: 522"). O wrapper só
        # repete em erro de transporte; erro de bundle real falha na primeira.
        # --use-api empacota no servidor do Supabase, sem puxar a imagem do edge-runtime
        # do Docker Hub: o runner compartilhado estourava "toomanyrequests: Data limit
        # exceeded" por horas, e o retry de 45s não adianta contra esse limite (runs
        # 39307383109 e 39315007872 em staging).
        run: scripts/retry-on-network-error.sh supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Marcar release nas edge functions (health + Sentry)
        # Ver comentário equivalente no job de staging.
        run: supabase secrets set RELEASE_SHA="$GITHUB_SHA" SENTRY_RELEASE="$GITHUB_SHA" SENTRY_ENV="production" --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Smoke test (health)
        # Mesmo script do staging (retry + status no log). Ver scripts/smoke-health.sh.
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
          # Em produção o smoke pulado em silêncio não vale: sem o secret, o job falha.
          SMOKE_OBRIGATORIO: "true"
        run: scripts/smoke-health.sh

  # Mesmo aviso do staging-ready, para o push em main (release). Olha os gates E o
  # deploy: se um gate falhou, o deploy de produção fica skipped, e isso também é
  # release que não chegou. Cancelado ou reprovado no Environment não abre issue.
  production-alert:
    name: Alerta de produção
    needs: [lint, typecheck, unit-tests, coverage, build, audit, secrets-scan, database, edge-functions, deploy-production]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Avaliar o release
        id: veredito
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          FALHAS=$(echo "$RESULTADOS" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
          DEPLOY=$(echo "$RESULTADOS" | jq -r '."deploy-production".result')
          if [ -n "$FALHAS" ]; then STATUS=failure
          elif [ "$DEPLOY" = "success" ]; then STATUS=success
          else STATUS=nenhum
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "falhas=$FALHAS" >> "$GITHUB_OUTPUT"
          echo "Release ${GITHUB_SHA:0:8}: status=$STATUS deploy=$DEPLOY falhas=[$FALHAS]"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.veredito.outputs.status != 'nenhum'
        with:
          sparse-checkout: .github/actions
      - name: Abrir ou fechar a issue de produção
        if: steps.veredito.outputs.status != 'nenhum'
        uses: ./.github/actions/notify-cron-failure
        with:
          job-name: produção
          title-prefix: Pipeline quebrado
          status: ${{ steps.veredito.outputs.status }}
          details: "Jobs que falharam: ${{ steps.veredito.outputs.falhas }}"
          token: ${{ github.token }}
