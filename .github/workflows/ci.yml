name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run test:run
      - run: npm run build
      - name: Bundle size budget
        run: npm run check:bundle-size

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner --verbose

  pgtap:
    name: pgTAP RLS tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install psql + pgtap client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d postgres -f "$f" || exit 1
          done
      - name: Enable pgtap + run tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
          # ON_ERROR_STOP garante que falha em qualquer teste mata o job
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_security.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/impersonation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/policy_audit_logs_impersonation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/policy_feature_based.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/policy_financeiro_module.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/policy_projetos_module.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/policy_crm_module.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/policy_equipe_portal_module.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/policy_admin_templates.sql

  types-sync-check:
    name: Supabase types in sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations to Postgres
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d postgres -f "$f" || exit 1
          done
      - name: Generate TypeScript types from local DB
        env:
          AUTH_HOOK_SEND_EMAIL_SECRET: "v1,whsec_dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0"
        run: |
          supabase gen types typescript \
            --db-url "postgresql://postgres:postgres@localhost:5432/postgres" \
            > /tmp/generated-types.ts
      - name: Compare with committed types
        run: |
          if ! diff -u src/integrations/supabase/types.ts /tmp/generated-types.ts; then
            echo "::error::src/integrations/supabase/types.ts is out of sync with the migrations. Run 'npm run gen:types' and commit the result."
            exit 1
          fi
