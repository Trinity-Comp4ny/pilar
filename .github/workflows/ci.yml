name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run test:run
      - run: npm run build
      - name: Bundle size budget
        run: npm run check:bundle-size

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner --verbose

  # Deploy do backend no Supabase de STAGING.
  # Roda como job do próprio CI (gatilho push do branch staging), então se
  # registra a partir do branch staging e NÃO depende do arquivo estar no main
  # (a pegadinha do workflow_run, que só liga a partir do branch default).
  # Só dispara em push no staging E depois que lint/test/build, audit e secrets
  # passarem. PRs não deployam (github.event_name != push).
  # Secrets no GitHub Environment "Staging": SUPABASE_ACCESS_TOKEN,
  # SUPABASE_DB_URL (Session Pooler IPv4), SUPABASE_PROJECT_REF.
  deploy-staging:
    name: Deploy → staging (Supabase)
    needs: [lint-test-build, audit, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: Staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # A CLI valida o config.toml inteiro em db push / functions deploy, e o bloco
      # [auth.hook.send_email] referencia env(AUTH_HOOK_SEND_EMAIL_SECRET). Sem essa
      # var o parse aborta antes de aplicar migration. NENHUM destes comandos aplica
      # config no servidor (db push = migrations; functions deploy = código), então
      # isto é só para o parse passar. O hook real vive no GoTrue do projeto.
      AUTH_HOOK_SEND_EMAIL_SECRET: ${{ secrets.AUTH_HOOK_SEND_EMAIL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrations (db push via pooler IPv4)
        # --db-url aponta pro Session Pooler (IPv4). A conexão direta do Supabase
        # é IPv6-only e falharia no runner IPv4-only do GitHub.
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Deploy das edge functions
        # Sem nome = deploya todas em supabase/functions, respeitando verify_jwt
        # de config.toml por função. Vai por HTTPS, IPv4 do runner basta.
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  # Deploy do backend em PRODUÇÃO. DORMENTE até este ci.yml chegar no branch main:
  # só dispara em push no main (github.ref) E o job precisa existir no arquivo do
  # branch onde o push ocorre. Em staging nunca roda (o if barra). Espelha o
  # deploy-staging, mas com o GitHub Environment "Production" (que pode exigir
  # aprovação manual). Ativa sozinho quando você promover staging → main.
  deploy-production:
    name: Deploy → production (Supabase)
    needs: [lint-test-build, audit, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AUTH_HOOK_SEND_EMAIL_SECRET: ${{ secrets.AUTH_HOOK_SEND_EMAIL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrations (db push via pooler IPv4)
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Deploy das edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

