name: Deploy Firebase Hosting

# Migração Vercel -> Firebase Hosting (ver docs/operations/MIGRACAO_VERCEL_FIREBASE.md).
#
# DISPARO SÓ MANUAL de propósito: enquanto a Vercel serve produção, este workflow não
# pode rodar em PR nem em push, nem gastar build. Os gatilhos `pull_request` (canal de
# preview) e `push` em staging/main entram DEPOIS do cutover, no passo 6 do runbook.
#
# Dois sites no mesmo projeto GCP: o app (raiz) e a landing (apps/marketing). Cada um
# tem o seu firebase.*.json, gerado a partir do vercel.json (CSP e headers idênticos).

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "Qual site publicar"
        type: choice
        options: [app, marketing]
        required: true
      canal:
        description: "preview = canal temporário (7 dias), live = produção do site"
        type: choice
        options: [preview, live]
        default: preview
        required: true

# Permissão mínima. `id-token` é para a federação de identidade (sem chave JSON).
permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-${{ inputs.alvo }}-${{ inputs.canal }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Variáveis e segredos de build ficam em Environments (staging x produção usam
    # Supabase diferentes). `live` usa `production`; preview usa `staging`.
    environment: ${{ inputs.canal == 'live' && 'production' || 'staging' }}
    env:
      SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_ENV: ${{ inputs.canal == 'live' && 'production' || 'preview' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENV: ${{ vars.VITE_SENTRY_ENV }}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_PASSKEY_ENABLED: ${{ vars.VITE_PASSKEY_ENABLED }}
      VITE_STATUS_URL: ${{ vars.VITE_STATUS_URL }}
      VITE_MARKETING_APP_URL: ${{ vars.VITE_MARKETING_APP_URL }}
      # Upload de sourcemap só em produção (igual à Vercel). Sem token o plugin pula.
      SENTRY_AUTH_TOKEN: ${{ inputs.canal == 'live' && secrets.SENTRY_AUTH_TOKEN || '' }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ inputs.alvo == 'app' && vars.SENTRY_PROJECT || '' }}
      FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      SITE_ID: ${{ inputs.alvo == 'app' && vars.FIREBASE_SITE_APP || vars.FIREBASE_SITE_MARKETING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Falha cedo se a configuração do GCP não existe
        run: |
          for v in FIREBASE_PROJECT SITE_ID VITE_SUPABASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::variável $v vazia no Environment"; exit 1; fi
          done

      - uses: ./.github/actions/setup-deps

      - name: Build
        run: |
          if [ "${{ inputs.alvo }}" = "app" ]; then npm run build; else npm run build:marketing; fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Publicar
        run: |
          if [ "${{ inputs.alvo }}" = "app" ]; then DIR=.; CFG=firebase.app.json; else DIR=apps/marketing; CFG=firebase.marketing.json; fi
          cd "$DIR"
          # O id do site entra aqui para o repo não carregar o id do projeto.
          jq --arg s "$SITE_ID" '.hosting.site = $s' "$CFG" > firebase.json
          if [ "${{ inputs.canal }}" = "live" ]; then
            npx --yes firebase-tools@14 deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive
          else
            npx --yes firebase-tools@14 hosting:channel:deploy "manual-${{ github.run_number }}" \
              --project "$FIREBASE_PROJECT" --expires 7d --non-interactive
          fi
