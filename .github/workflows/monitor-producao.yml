name: Monitor de produção

# Checks sintéticos contra produção a cada 10 min: health da Edge Function (componentes,
# SPEC 105), landing, tela de login, guarda de rota e login real com o usuário de monitor. Substitui o Checkly, que
# estava configurado (checkly.config.ts) mas nunca rodou: sem conta, sem canal de
# alerta e com o health apontando para o domínio errado.
#
# Alerta: falha abre (ou comenta) a issue "Cron falhando: Monitor de produção", e o
# GitHub avisa por e-mail quem acompanha o repo. Grátis em repositório público.
#
# Mesma pegadinha de todo `schedule`: só dispara a partir da branch default (main).
# O cron do GitHub também pode atrasar alguns minutos em horário de pico; serve para
# "o produto caiu e ninguém viu", não para SLA de minuto.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # notify-cron-failure

concurrency:
  group: monitor-producao
  cancel-in-progress: false

jobs:
  sintetico:
    name: Checks sintéticos (produção)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checks contra app.pilarsoft.com.br
        run: npx playwright test --config tests/synthetic/playwright.config.ts
        env:
          # Usuário de monitor (docs/operations/monitoring/synthetic-tests.md). Sem os
          # secrets, o check de login real é pulado e o resto roda.
          PILAR_MONITOR_EMAIL: ${{ secrets.PILAR_MONITOR_EMAIL }}
          PILAR_MONITOR_PASSWORD: ${{ secrets.PILAR_MONITOR_PASSWORD }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: monitor-producao-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Notificar falha
        if: failure()
        uses: ./.github/actions/notify-cron-failure
        with:
          job-name: Monitor de produção
          token: ${{ github.token }}
