name: Promote staging → main

# Abre (ou atualiza) o PR de release staging → main. Fazer merge desse PR empurra
# staging em main, e o push em main dispara o deploy-production do ci.yml — que passa
# pelo gate humano do GitHub Environment "Production". Ou seja: este workflow só PREPARA
# a promoção; quem promove é o merge revisado, não a automação.
#
# Gate "staging pronto": o PR de release só é montado/atualizado quando o commit atual
# de staging passou no CI E foi aplicado e testado no ambiente de staging (jobs
# "Deploy → staging" e "E2E → staging" verdes). O "CI OK" sozinho diz que o código é
# mergeável, não que o banco e as funções de staging aceitaram a mudança: em 13/10 o
# deploy falhou por drift de migration e o release foi preparado mesmo assim.
#
# Por isso o gatilho é o fim do CI em staging (workflow_run), não o push: no push o CI
# ainda nem começou. Armadilha da branch default (feedback_github_actions_default_branch_trap):
# workflow_run e workflow_dispatch só valem a partir do arquivo que está em main; até o
# próximo release levar este arquivo para main, o gatilho que vale é o de lá.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]

permissions:
  # write (não read) porque o job força um push da branch release/staging-to-main —
  # o GITHUB_TOKEN padrão com contents:read falha esse push com "Permission denied",
  # mesmo sem chegar perto do create-PR (achado ao vivo rodando isto de verdade).
  contents: write
  pull-requests: write
  # Ler o run e os jobs do CI de staging para o gate.
  actions: read

concurrency:
  group: promote-staging-to-main
  cancel-in-progress: false

jobs:
  release-pr:
    name: Abrir/atualizar PR de release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Staging pronto? (CI, deploy e E2E de staging no commit atual)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID_EVENTO: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git fetch origin staging --quiet
          SHA=$(git rev-parse origin/staging)

          if [ "$EVENTO" = "workflow_run" ]; then
            # CI de um commit que já não é o topo de staging: o run do commit novo
            # chama este workflow de novo quando terminar.
            if [ "$RUN_SHA" != "$SHA" ]; then
              echo "::notice::CI terminou para ${RUN_SHA:0:8}, mas staging já está em ${SHA:0:8}. Espera o próximo."
              echo "pronto=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RUN_ID="$RUN_ID_EVENTO"
          else
            RUN_ID=$(gh run list --workflow ci.yml --branch staging --event push --commit "$SHA" \
              --json databaseId,status --jq '[.[] | select(.status == "completed")][0].databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo "::error::O CI de staging em ${SHA:0:8} ainda não terminou (ou não rodou). Rode de novo quando acabar."
              exit 1
            fi
          fi

          FALTA=$(gh run view "$RUN_ID" --json jobs --jq '
            [.jobs[] | select(.name == "Deploy → staging (Supabase)" or .name == "E2E → staging (Playwright)")]
            | if length < 2 then "jobs de staging não encontrados no run"
              else map(select(.conclusion != "success") | "\(.name) = \(.conclusion)") | join("; ") end')
          if [ -n "$FALTA" ]; then
            echo "::error::Staging não está pronto em ${SHA:0:8}: $FALTA. Release não preparado (run $RUN_ID)."
            exit 1
          fi
          echo "::notice::Staging pronto em ${SHA:0:8} (run $RUN_ID): deploy e E2E de staging verdes."
          echo "pronto=true" >> "$GITHUB_OUTPUT"

      - name: Abrir ou atualizar o PR de release (branch + read-tree)
        if: steps.gate.outputs.pronto == 'true'
        # NUNCA abre PR direto staging→main: o histórico diverge (releases antigos
        # foram squash), então qualquer método por replay (merge/rebase) dá conflito
        # falso. Usa o mesmo método do runbook manual (CLAUDE.md /
        # project_runbook_promocao_staging_main): branch única `release/staging-to-main`
        # nascida de origin/main, árvore substituída pela de origin/staging via
        # `read-tree`, um commit, force-push. Reexecuta a cada push em staging: sempre
        # a MESMA branch, reconstruída do zero a partir de main, então force é
        # intencional (não é branch de trabalho humano, é gerada).
        #
        # Prefere um PAT (RELEASE_PAT) se existir: um PR criado com o GITHUB_TOKEN
        # padrão não dispara os workflows de CI do PR, então required checks em main
        # ficariam pendentes para sempre.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin main staging --quiet

          AHEAD=$(git rev-list --count origin/main..origin/staging)
          if [ "$AHEAD" -eq 0 ]; then
            echo "::notice::staging não está à frente de main — nada a promover."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="release/staging-to-main"
          TITLE="Release: promote staging to main ($DATE)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH" origin/main
          git read-tree --reset -u origin/staging

          if git diff --quiet HEAD; then
            echo "::notice::árvore de $BRANCH já é idêntica a staging — nada a commitar."
          else
            git add -A
            git commit --no-verify -m "$TITLE"
          fi

          git push --force origin "$BRANCH"

          BODY_FILE=$(mktemp)
          {
            echo "## Promover staging → main"
            echo ""
            echo "**${AHEAD}** commit(s) à frente de main (árvore de \`$BRANCH\` = árvore de \`staging\`)."
            echo ""
            echo "### Commits"
            git log --pretty='- \`%h\` %s' origin/main..origin/staging
            echo ""
            echo "### Migrations neste release"
            MIGR=$(git diff --name-only --diff-filter=A origin/main..origin/staging -- 'supabase/migrations/' || true)
            if [ -n "$MIGR" ]; then
              echo "$MIGR" | sed 's#supabase/migrations/#- #'
            else
              echo "_Nenhuma migration nova._"
            fi
            echo ""
            echo "---"
            echo "> Merge com \`gh pr merge <n> --admin --squash --delete-branch\` (branch já é 1 commit)."
            echo "> O merge dispara o deploy de produção (gate humano no Environment **Production**)."
            echo "> Confira que \`types.ts\` está em sync e que o \`npm audit\` não tem high aberto."
          } > "$BODY_FILE"

          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            echo "::notice::PR de release #$EXISTING atualizado."
            exit 0
          fi

          # Sem RELEASE_PAT nem a permissão "Allow GitHub Actions to create and approve
          # pull requests", o GITHUB_TOKEN padrão não cria PR (política do repo/org) — e
          # isso precisa FALHAR o job, não virar aviso: um job verde sem PR nenhum aberto
          # é o oposto de "promoção pronta". A branch já está pronta e pushada; falta só
          # abrir o PR (na mão, ou configurando um dos dois acima para o job se curar sozinho).
          if gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE"; then
            echo "::notice::PR de release criado."
            # Com o RELEASE_PAT, "@me" é o dono do token, e todo PR do repo tem
            # assignee. Com o GITHUB_TOKEN o "@me" seria o bot: falha sem derrubar o job.
            gh pr edit "$BRANCH" --add-assignee "@me" || echo "::warning::Não consegui definir o assignee do PR de release."
          else
            echo "::error::Não consegui criar o PR de release. A branch '$BRANCH' já está pronta e pushada — abra manualmente com: gh pr create --base main --head $BRANCH --title \"$TITLE\" --body-file <arquivo>. Para o job se curar sozinho, adicione o secret RELEASE_PAT ou habilite 'Allow GitHub Actions to create and approve pull requests' em Settings → Actions → General."
            exit 1
          fi
