# Dependabot — mantém dependências atualizadas.
#
# Alvo = branch `staging`, NÃO `main`. Staging é o tronco de integração real deste
# repo (o CI roda e deploya a partir dele); main só recebe releases promovidos. Se
# o Dependabot mirasse o default (main), os PRs pulariam o CI de staging e o gate de
# audit. Ver docs/CLAUDE.md e o workflow promote-staging-to-main.yml.
#
# Deno (supabase/functions) fica de fora: o Dependabot não suporta ecossistema Deno.
# Os imports remotos das edge functions são pinados/checados pelo `deno check` no CI.
version: 2
updates:
  # Dependências do app (npm na raiz).
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # 8, não 5: com 5 o limite estourou em 24/08 e a PR do react-dom foi engolida
    # silenciosamente, deixando a do react órfã. Limite baixo não reduz trabalho,
    # esconde metade dele.
    open-pull-requests-limit: 8
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    # Agrupa minor/patch para cortar ruído de PR. Major fica separado (1 PR por pacote),
    # porque tende a exigir revisão manual de breaking change.
    #
    # EXCEÇÃO: a família do React anda junta, em qualquer tipo de update. Em 24/08 o
    # Dependabot abriu uma PR de `react` 18 → 19 SEM `react-dom`, que ficou em 18, e
    # o CI quebrou com `Cannot read properties of undefined (reading
    # 'ReactCurrentDispatcher')`: react-dom 18 lendo um interno que o React 19
    # removeu. A PR era impossível de mergear e ninguém percebeu de imediato porque a
    # falha parecia problema de teste. Causa: major vira 1 PR por pacote e o
    # `open-pull-requests-limit: 5` estourou, então a PR do react-dom nunca nasceu.
    # Com o grupo abaixo, a família vem numa PR só e nunca meio-atualizada.
    groups:
      react-family:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Actions dos próprios workflows (checkout, setup-node, setup-cli, etc.).
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        update-types:
          - minor
          - patch
