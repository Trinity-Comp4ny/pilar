<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><style>
:root{--W:1920px;--H:1080px} body{background:#15110e}
#f{position:absolute;left:0;top:0;width:1920px;height:1080px}
#hk{position:absolute;left:90px;top:90px}
.box{background:rgba(26,26,26,.86);border-radius:32px;padding:26px 40px 32px;color:#fff}
#ch{position:absolute;left:90px;bottom:90px}
.num{font-weight:600;font-size:36px;color:var(--ink);background:var(--brand);border-radius:999px;padding:4px 16px}
.sub{font-size:30px;color:var(--g3);font-weight:400;margin-left:8px}
#end .logo{width:440px} #end{gap:40px}
</style></head><body>
<img id="f">
<div id="hk"><div class="box"><div class="h2" style="color:#fff">Do traço no papel <span class="pill"><span>à casa pronta.</span></span></div></div></div>
<div id="ch"><span class="chip" id="chip"><span class="num" id="cn"></span><span id="ct"></span><span class="sub" id="cs"></span></span></div>
<script src="kit.js"></script><script>
window.DUR=11.5;
const ST=[[0.6,'01','Locação e baldrame','marcação e fundação'],[1.9,'02','Pilares','armadura de aço e concreto'],[2.75,'03','Alvenaria','bloco cerâmico, fiada por fiada'],[4.9,'04','Vigas e contrapiso','cinta de amarração e base do piso'],[6.1,'05','Reboco e esquadrias','paredes, portas e janelas'],[7.3,'06','Telhado','tesoura, terça e telha'],[8.55,'07','Paisagismo','jardim e calçada'],[9.2,'','Casa pronta.','']];
window.render=async(t)=>{
  const fi=t<10.25?Math.round(t*30):Math.round(307*(1-easeIO(lin(t,10.25,11.4)))); await setFrame($('f'),'../fr_h169/f'+String(fi).padStart(4,'0')+'.jpg');
  $('hk').style.display=t<2.5?'block':'none';
  let cur=-1; ST.forEach((s,i)=>{if(t>=s[0])cur=i;}); const ch=$('ch');
  if(cur<0||t>=10.2){ch.style.display='none';} else { ch.style.display='block'; const s=ST[cur]; $('cn').style.display=s[1]?'':'none'; $('cn').textContent=s[1]; $('ct').textContent=s[2]; $('cs').textContent=s[3]; enter('chip',t,s[0],20,0.35); }
};
window.ready=true;
</script></body></html>
