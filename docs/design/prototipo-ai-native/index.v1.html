<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilar AI-native · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --app:0 0% 99%;--card:0 0% 100%;--side:0 0% 97%;--muted:0 0% 93%;
  --border:220 13% 91%;--border-subtle:0 0% 85%;--border-strong:216 12% 84%;
  --ink:0 0% 10%;--ink-soft:0 0% 24%;--text-muted:220 9% 41%;--disabled:220 9% 65%;
  --brand:102 73% 73%;--brand-soft:102 62% 91%;
  --success-soft:138 76% 97%;--success-border:141 79% 85%;--success-strong:143 64% 24%;--success-mid:142 72% 29%;
  --danger-soft:0 93% 94%;--danger-border:0 96% 89%;--danger-strong:0 63% 31%;--danger-mid:0 74% 42%;
  --info-soft:214 100% 97%;--info-border:214 95% 93%;--info-strong:226 71% 40%;--info-mid:224 76% 48%;
  --warning-soft:48 100% 96%;--warning-border:48 96% 89%;--warning-strong:23 83% 31%;--warning-mid:26 90% 37%;
  --attention-soft:33 100% 96%;--attention-border:34 100% 92%;--attention-strong:15 79% 34%;
  --highlight-soft:270 100% 98%;--highlight-border:269 100% 95%;--highlight-strong:273 67% 39%;
  --obra:32 78% 86%;--obra-strong:28 66% 32%;--projetos:210 68% 89%;--projetos-strong:212 53% 34%;
  --chart-info:217 91% 60%;--chart-warning:48 96% 47%;--chart-success:142 71% 45%;--chart-danger:0 84% 60%;--chart-grid:220 13% 91%;
  --shadow-card:0 1px 3px 0 hsl(0 0% 10% / .06),0 1px 2px -1px hsl(0 0% 10% / .06);
  --shadow-pop:0 8px 32px -4px hsl(0 0% 10% / .12);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:hsl(var(--muted));color:hsl(var(--ink));font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}

/* barra do protótipo (fora do app) */
#proto{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:hsl(var(--ink));color:#fff}
#proto .t{font-weight:600;font-size:13px;margin-right:auto;display:flex;gap:8px;align-items:center}
#proto .t small{font-weight:400;opacity:.65}
.seg{display:inline-flex;background:hsl(0 0% 100% / .1);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:5px 12px;border-radius:999px;font-size:12px;opacity:.8}
.seg button.on{background:hsl(var(--brand));color:hsl(var(--ink));opacity:1;font-weight:600}
#stage{padding:0}
#device.desktop{min-height:calc(100vh - 50px);background:hsl(var(--app))}
#device.mobile{width:390px;height:800px;margin:24px auto;border:10px solid hsl(var(--ink));border-radius:44px;overflow:auto;background:hsl(var(--app));position:relative;box-shadow:var(--shadow-pop)}
#app{container-type:inline-size;container-name:app;min-height:100%}

/* shell */
.shell{display:grid;grid-template-columns:84px 1fr;min-height:calc(100vh - 50px)}
#device.mobile .shell{min-height:780px}
.rail{background:hsl(var(--side));border-right:1px solid hsl(var(--border));padding:12px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 12px;font-weight:700;font-size:13px;letter-spacing:-.01em}
.logo .mk{display:flex;gap:2px;align-items:flex-end;height:20px}
.logo .mk i{display:block;width:5px;background:hsl(var(--ink));border-radius:1px}
.logo .mk i:nth-child(2){background:hsl(var(--brand))}
.ri{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;border:0;background:transparent;font-size:10.5px;color:hsl(var(--text-muted));position:relative}
.ri:hover{background:hsl(var(--muted));color:hsl(var(--ink))}
.ri.on{background:hsl(var(--brand));color:hsl(var(--ink));font-weight:600}
.ri .dot{position:absolute;top:5px;right:14px;width:7px;height:7px;border-radius:9px;background:hsl(var(--chart-danger))}
.ri.sep{margin-top:8px}
main{min-width:0}
.ph{position:sticky;top:50px;z-index:5;background:hsl(var(--app) / .94);backdrop-filter:blur(6px);border-bottom:1px solid hsl(var(--border));padding:16px 28px 0}
.ph .crumbs{font-size:12px;color:hsl(var(--text-muted));margin-bottom:2px}
.ph .row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px}
.ph h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:700}
.ph p.sub{margin:2px 0 0;color:hsl(var(--ink-soft))}
.tabs{display:flex;gap:18px;overflow-x:auto;margin-top:-4px}
.tabs button{border:0;background:none;padding:8px 0 10px;color:hsl(var(--text-muted));border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:hsl(var(--ink));border-color:hsl(var(--ink));font-weight:600}
.pc{padding:20px 28px 48px;max-width:1440px}

/* blocos */
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;box-shadow:var(--shadow-card)}
.card.p{padding:16px}
.card h3,.h3{font-size:14px;margin:0 0 10px;font-weight:600;display:flex;gap:8px;align-items:center}
.card h3 .r{margin-left:auto}
.muted{color:hsl(var(--text-muted))}
.soft{color:hsl(var(--ink-soft))}
.xs{font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.g-side-l{grid-template-columns:300px minmax(0,1fr)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}
hr.s{border:0;border-top:1px solid hsl(var(--border));margin:12px 0}

.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .2s var(--ease),background .2s}
.btn:active{transform:scale(.98)}
.btn.brand{background:hsl(var(--brand));color:hsl(var(--ink))}
.btn.brand:hover{background:hsl(102 73% 66%)}
.btn.outline{background:hsl(var(--card));border-color:hsl(var(--border-strong))}
.btn.outline:hover{background:hsl(var(--muted))}
.btn.ghost{background:transparent;color:hsl(var(--ink-soft))}
.btn.ghost:hover{background:hsl(var(--muted))}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}

.b{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.b-success{background:hsl(var(--success-soft));border-color:hsl(var(--success-border));color:hsl(var(--success-strong))}
.b-danger{background:hsl(var(--danger-soft));border-color:hsl(var(--danger-border));color:hsl(var(--danger-strong))}
.b-info{background:hsl(var(--info-soft));border-color:hsl(var(--info-border));color:hsl(var(--info-strong))}
.b-warning{background:hsl(var(--warning-soft));border-color:hsl(var(--warning-border));color:hsl(var(--warning-strong))}
.b-attention{background:hsl(var(--attention-soft));border-color:hsl(var(--attention-border));color:hsl(var(--attention-strong))}
.b-highlight{background:hsl(var(--highlight-soft));border-color:hsl(var(--highlight-border));color:hsl(var(--highlight-strong))}
.b-neutral{background:hsl(var(--muted));color:hsl(var(--text-muted))}
.b-brand{background:hsl(var(--brand-soft));color:hsl(var(--success-strong))}
.b-obra{background:hsl(var(--obra));color:hsl(var(--obra-strong))}
.b-proj{background:hsl(var(--projetos));color:hsl(var(--projetos-strong))}

.agent{display:flex;gap:10px;padding:12px;border-radius:12px;background:hsl(var(--brand-soft) / .55);border:1px solid hsl(var(--brand) / .55)}
.agent .av{width:28px;height:28px;border-radius:8px;background:hsl(var(--ink));color:hsl(var(--brand));display:grid;place-items:center;flex:none}
.agent .av svg{width:16px;height:16px}
.callout{display:flex;gap:10px;padding:12px;border-radius:12px;border:1px solid}
.callout.warn{background:hsl(var(--warning-soft));border-color:hsl(var(--warning-border));color:hsl(var(--warning-strong))}
.callout.info{background:hsl(var(--info-soft));border-color:hsl(var(--info-border));color:hsl(var(--info-strong))}
.callout.danger{background:hsl(var(--danger-soft));border-color:hsl(var(--danger-border));color:hsl(var(--danger-strong))}
.callout.ok{background:hsl(var(--success-soft));border-color:hsl(var(--success-border));color:hsl(var(--success-strong))}
.callout b{color:hsl(var(--ink))}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:hsl(var(--text-muted));font-size:12px;padding:8px 10px;border-bottom:1px solid hsl(var(--border));white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid hsl(var(--border));vertical-align:top}
table.t tr.sel td{background:hsl(var(--brand-soft) / .45)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:hsl(var(--muted) / .6)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:hsl(var(--text-muted))}
.scroll-x{overflow-x:auto}

/* mesa */
.col{background:hsl(var(--side));border:1px solid hsl(var(--border));border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col>.hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:2px 4px}
.col>.hd .n{margin-left:auto;font-size:12px;color:hsl(var(--text-muted))}
.item{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item .tt{font-weight:600}
.item .who{font-size:12px;color:hsl(var(--text-muted));display:flex;gap:6px;align-items:center}

/* stepper */
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px;border:0;background:none;text-align:left;padding:0 8px 0 0}
.step .bar{height:4px;border-radius:9px;background:hsl(var(--muted))}
.step.done .bar{background:hsl(var(--chart-success))}
.step.on .bar{background:hsl(var(--ink))}
.step .lb{font-size:12px;color:hsl(var(--text-muted))}
.step.on .lb,.step.done .lb{color:hsl(var(--ink))}
.step .lb b{display:block;font-size:11px;font-weight:500;color:hsl(var(--text-muted))}
.log{display:flex;flex-direction:column;gap:0}
.log .e{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed hsl(var(--border));font-size:12.5px;animation:in .5s var(--ease)}
.log .e .h{color:hsl(var(--text-muted));font-variant-numeric:tabular-nums}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fld{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid hsl(var(--border))}
.fld .k{color:hsl(var(--text-muted));font-size:12.5px}

/* gantt */
.gantt{--cw:36px;font-size:12px;min-width:max-content}
.g-head,.g-row{display:grid;grid-template-columns:230px repeat(21,var(--cw))}
.g-head .d{text-align:center;padding:4px 0;color:hsl(var(--text-muted));border-left:1px solid hsl(var(--border) / .6)}
.g-head .d b{display:block;color:hsl(var(--ink));font-weight:600}
.g-head .d.today{background:hsl(var(--brand-soft))}
.g-head .w{display:grid;place-items:center;padding:4px 0;border-left:1px solid hsl(var(--border) / .6)}
.g-head .w.rain{background:hsl(var(--info-soft))}
.g-row{position:relative;border-top:1px solid hsl(var(--border))}
.g-row .nm{padding:8px 10px 8px 0;display:flex;gap:6px;align-items:center;min-width:0}
.g-row .nm span.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row .c{border-left:1px solid hsl(var(--border) / .6)}
.g-row .c.rain{background:hsl(var(--info-soft) / .8)}
.g-row .c.wk{background:hsl(var(--muted) / .5)}
.g-grp{grid-column:1/-1;padding:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--text-muted));font-weight:600}
.gbar{position:absolute;top:7px;height:22px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;transition:left .8s var(--ease),width .8s var(--ease),background .4s}
.gbar.done{background:hsl(var(--chart-success) / .25);color:hsl(var(--success-strong))}
.gbar.progress{background:hsl(var(--chart-warning) / .35);color:hsl(var(--warning-strong))}
.gbar.planned{background:hsl(var(--projetos));color:hsl(var(--projetos-strong))}
.gbar.blocked{background:repeating-linear-gradient(45deg,hsl(var(--danger-soft)),hsl(var(--danger-soft)) 6px,hsl(var(--danger-border)) 6px,hsl(var(--danger-border)) 12px);color:hsl(var(--danger-strong))}
.gbar.critical{background:hsl(var(--ink));color:hsl(var(--brand))}
.gbar.ext::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:9px;background:hsl(var(--chart-info))}
.gbar.moved{outline:2px solid hsl(var(--ink));outline-offset:1px}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:hsl(var(--ink));pointer-events:none}

/* clima */
.wx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wx .d{border:1px solid hsl(var(--border));border-radius:12px;padding:10px;background:hsl(var(--card));display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.wx .d.rain{background:hsl(var(--info-soft));border-color:hsl(var(--info-border))}
.wx .d.today{outline:2px solid hsl(var(--ink));outline-offset:-1px}
.wx .d .tp{font-size:18px;font-weight:700}
.wx .d .dd{font-size:12px;color:hsl(var(--text-muted))}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid hsl(var(--border))}
.ok{color:hsl(var(--success-mid))}.no{color:hsl(var(--danger-mid))}

/* 3d / planta */
.viewer{position:relative;border-radius:12px;border:1px solid hsl(var(--border));background:linear-gradient(180deg,hsl(0 0% 100%),hsl(80 10% 95%));overflow:hidden;height:440px}
.viewer canvas{display:block;touch-action:none;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.viewer .hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.viewer .hud2{position:absolute;right:12px;top:12px;z-index:2}
.viewer .legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;background:hsl(var(--card) / .9);padding:6px 10px;border-radius:999px;font-size:11.5px;z-index:2;border:1px solid hsl(var(--border))}
.viewer .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.viewer .lbls{position:absolute;inset:0;pointer-events:none;z-index:1}
.viewer .lbls span{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;background:hsl(var(--card) / .85);padding:1px 6px;border-radius:6px;white-space:nowrap;transition:background .3s}
.viewer .lbls span.hl{background:hsl(var(--ink));color:hsl(var(--brand))}
.viewer .hint{position:absolute;right:12px;bottom:12px;font-size:11px;color:hsl(var(--text-muted));z-index:2}
.viewer .plan2d{width:100%;height:100%;display:grid;place-items:center;padding:12px}
.viewer .plan2d svg{width:100%;height:100%}
.v-err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}

/* scanner */
.drop{border:1.5px dashed hsl(var(--border-strong));border-radius:12px;padding:18px;text-align:center;background:hsl(var(--side))}
.file{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card))}
.file .ic{width:34px;height:40px;border-radius:6px;background:hsl(var(--danger-soft));color:hsl(var(--danger-mid));display:grid;place-items:center;font-size:10px;font-weight:700}
.pipe .s{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:13px;color:hsl(var(--disabled))}
.pipe .s.on{color:hsl(var(--ink))}
.pipe .s.done{color:hsl(var(--ink-soft))}
.pipe .s .m{width:18px;height:18px;border-radius:9px;border:1.5px solid currentColor;display:grid;place-items:center;flex:none;margin-top:1px}
.pipe .s.done .m{background:hsl(var(--chart-success));border-color:hsl(var(--chart-success));color:#fff}
.pipe .s.on .m{border-color:hsl(var(--ink));animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px hsl(var(--brand) / .6)}}
.scanline{position:absolute;left:0;right:0;height:3px;background:hsl(var(--ink) / .7);animation:scan 1.6s linear infinite;z-index:3}
@keyframes scan{from{top:0}to{top:100%}}

/* campo / celular */
.phone{width:320px;flex:none;border:9px solid hsl(var(--ink));border-radius:38px;background:hsl(var(--app));overflow:hidden;box-shadow:var(--shadow-pop)}
.phone .bar0{height:26px;display:flex;justify-content:space-between;padding:6px 18px 0;font-size:11px;font-weight:600}
.phone .pb{padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px;min-height:560px}
.rec{width:84px;height:84px;border-radius:50%;border:0;background:hsl(var(--brand));display:grid;place-items:center;margin:8px auto 0;box-shadow:0 0 0 8px hsl(var(--brand-soft))}
.rec.on{background:hsl(var(--chart-danger));color:#fff;animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 14px hsl(var(--danger-soft))}}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:36px}
.wave i{display:block;width:4px;border-radius:3px;background:hsl(var(--ink));animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:30px}}
.bubble{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:14px;padding:10px 12px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid hsl(var(--border-strong));background:hsl(var(--card));border-radius:999px;padding:5px 12px;font-size:12px}
.chip.on{background:hsl(var(--brand));border-color:transparent;font-weight:600}

/* loading / estados */
.ring{width:44px;height:44px}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:hsl(var(--muted))}
.ring .fg{stroke:hsl(var(--ink));stroke-dasharray:110;stroke-dashoffset:110;animation:read 1.6s var(--ease) infinite;transform-origin:center;transform:rotate(-90deg)}
@keyframes read{0%{stroke-dashoffset:110}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-110}}
.sk{border-radius:10px;background:linear-gradient(90deg,hsl(var(--muted)),hsl(var(--side)),hsl(var(--muted)));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 20px;max-width:520px;margin:0 auto}
.state .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:hsl(var(--muted))}
.state.err .ic{background:hsl(var(--danger-soft));color:hsl(var(--danger-mid))}
.state h2{margin:4px 0 0;font-size:18px}
.state p{margin:0;color:hsl(var(--ink-soft))}

/* plano */
.lane{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid hsl(var(--border))}
.lane h4{margin:0;font-size:13px;display:flex;gap:8px;align-items:center}

.lane button.it{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid hsl(var(--border));background:hsl(var(--card));width:100%}

/* portal */

.photo{border-radius:10px;aspect-ratio:4/3;background:linear-gradient(135deg,hsl(32 30% 78%),hsl(28 20% 62%));position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:repeating-linear-gradient(0deg,hsl(15 40% 52%),hsl(15 40% 52%) 9px,hsl(30 15% 85%) 9px,hsl(30 15% 85%) 11px)}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:hsl(var(--ink));color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;transition:all .4s var(--ease);max-width:min(560px,90vw);box-shadow:var(--shadow-pop)}

.sheet button{border:1px solid hsl(var(--border));background:hsl(var(--side));border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}

  .ph .row .acts{display:none}
  .pc{padding:14px 16px 96px}
  .g2,.g3,.g4,.g-side,.g-side-l{grid-template-columns:1fr}

}

/* ============ planta (dado da casa) ============ */
const H3=2.8,T3=0.15;

const area=r=>((r.x1-r.x0)*(r.y1-r.y0));
const per=r=>2*((r.x1-r.x0)+(r.y1-r.y0));
const fmt=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
function wallPieces(w){
  const len=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]);let cur=-T3/2;const out=[];
  (w.op||[]).slice().sort((x,y)=>x.at-y.at).forEach(o=>{
    if(o.at>cur) out.push({s:cur,l:o.at-cur,y0:0,y1:H3,k:'solid'});
    if(o.t==='door') out.push({s:o.at,l:o.w,y0:2.1,y1:H3,k:'lintel',o});
    else {out.push({s:o.at,l:o.w,y0:0,y1:1.0,k:'sill',o});out.push({s:o.at,l:o.w,y0:2.1,y1:H3,k:'lintel',o});}
    cur=o.at+o.w;
  });
  out.push({s:cur,l:len+T3/2-cur,y0:0,y1:H3,k:'solid'});
  return {len,pieces:out};
}
/* estados de parede por cenário */
const BASE_WALLS={w4:'done',w5:'done',w6:'done',w7:'done',w8:'done',w15:'done',w16:'done'};

const WCOL={done:'#5fb84f',reported:'#f0a92e',none:'#cfcfcf',divergent:'#e5534b',neutral:'#e7e2d6'};

/* ============ planta 2D (SVG) ============ */
function plan2D({states=null,mode='clean',hl=null}={}){
  const K=40,P=46,W=12*K+P*2,Hh=9*K+P*2+(mode==='paper'?54:0);
  const X=x=>P+x*K,Y=y=>P+y*K;
  const paper=mode==='paper';
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Planta baixa">`;
  if(paper){
    s+=`<rect width="${W}" height="${Hh}" fill="#fbfaf5"/>`;
    for(let i=0;i<W;i+=20) s+=`<line x1="${i}" y1="0" x2="${i}" y2="${Hh}" stroke="#ece9df" stroke-width=".6"/>`;
    for(let j=0;j<Hh;j+=20) s+=`<line x1="0" y1="${j}" x2="${W}" y2="${j}" stroke="#ece9df" stroke-width=".6"/>`;
  }
  PLAN.rooms.forEach(r=>{
    const fill=paper?'none':(hl===r.id?'hsl(38 92% 50% / .18)':'#'+r.floor.toString(16));
    s+=`<rect x="${X(r.x0)}" y="${Y(r.y0)}" width="${(r.x1-r.x0)*K}" height="${(r.y1-r.y0)*K}" fill="${fill}"/>`;
  });
  PLAN.walls.forEach(w=>{
    const {pieces}=wallPieces(w);const dx=(w.b[0]-w.a[0]),dy=(w.b[1]-w.a[1]);const len=Math.hypot(dx,dy);const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    const st=states?(states[w.id]||'none'):null;
    const col=paper?'#55524a':(st?WCOL[st]:'#2b2b2b');
    const dash=st==='none'?'stroke-dasharray="4 4"':'';
    const sw=st==='none'?2:T3*K;
    pieces.forEach(p=>{
      const x1=X(w.a[0]+ux*p.s),y1=Y(w.a[1]+uy*p.s),x2=X(w.a[0]+ux*(p.s+p.l)),y2=Y(w.a[1]+uy*(p.s+p.l));
      if(p.k==='solid') s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" ${dash} stroke-linecap="square"/>`;
      if(p.k==='sill'){
        const o=T3*K/3;
        s+=`<line x1="${x1+nx*o}" y1="${y1+ny*o}" x2="${x2+nx*o}" y2="${y2+ny*o}" stroke="${paper?'#55524a':'#6b7280'}" stroke-width="1.2"/><line x1="${x1-nx*o}" y1="${y1-ny*o}" x2="${x2-nx*o}" y2="${y2-ny*o}" stroke="${paper?'#55524a':'#6b7280'}" stroke-width="1.2"/>`;
      }
      if(p.k==='lintel'&&p.o.t==='door'){
        const r=p.l*K;const hx=x1,hy=y1;const ex=hx+nx*r,ey=hy+ny*r;
        s+=`<path d="M${x2} ${y2} A${r} ${r} 0 0 0 ${ex} ${ey}" fill="none" stroke="${paper?'#8a8578':'#9ca3af'}" stroke-width="1" stroke-dasharray="3 3"/><line x1="${hx}" y1="${hy}" x2="${ex}" y2="${ey}" stroke="${paper?'#55524a':'#6b7280'}" stroke-width="1.4"/>`;
      }
    });
  });
  PLAN.rooms.forEach(r=>{
    const cx=X((r.x0+r.x1)/2),cy=Y((r.y0+r.y1)/2);
    s+=`<text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="${paper?11:13}" font-weight="${paper?500:600}" fill="${paper?'#3d3a33':'#1a1a1a'}" ${paper?'letter-spacing="1"':''}>${paper?r.nome.toUpperCase():r.nome}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="11" fill="${paper?'#6b675d':'#5f6570'}">${fmt(area(r))} m²</text>`;
  });
  const dc=paper?'#6b675d':'#9ca3af';
  s+=`<line x1="${X(0)}" y1="${P-22}" x2="${X(12)}" y2="${P-22}" stroke="${dc}"/><line x1="${X(0)}" y1="${P-27}" x2="${X(0)}" y2="${P-17}" stroke="${dc}"/><line x1="${X(12)}" y1="${P-27}" x2="${X(12)}" y2="${P-17}" stroke="${dc}"/><text x="${X(6)}" y="${P-27}" text-anchor="middle" font-size="11" fill="${dc}">12,00</text>`;
  s+=`<line x1="${P-22}" y1="${Y(0)}" x2="${P-22}" y2="${Y(9)}" stroke="${dc}"/><line x1="${P-27}" y1="${Y(0)}" x2="${P-17}" y2="${Y(0)}" stroke="${dc}"/><line x1="${P-27}" y1="${Y(9)}" x2="${P-17}" y2="${Y(9)}" stroke="${dc}"/><text x="${P-28}" y="${Y(4.5)}" text-anchor="middle" font-size="11" fill="${dc}" transform="rotate(-90 ${P-28} ${Y(4.5)})">9,00</text>`;
  if(paper){
    const by=Y(9)+18;
    s+=`<rect x="${X(5.5)}" y="${by}" width="${6.5*K}" height="40" fill="none" stroke="#55524a"/><text x="${X(5.7)}" y="${by+16}" font-size="10" fill="#3d3a33" font-weight="600">RESIDÊNCIA ALVES · PLANTA BAIXA TÉRREO</text><text x="${X(5.7)}" y="${by+31}" font-size="9" fill="#6b675d">ESC. 1:50 · FOLHA 01/04 · ARQ. REV. 02</text>`;
  }
  return s+'</svg>';
}

/* ============ 3D (three.js) ============ */

  const w=el.clientWidth||600,h=el.clientHeight||420;

  const groups={};const edgeMat=new THREE.LineBasicMaterial({color:0x3a3a3a,transparent:true,opacity:.28});
  PLAN.walls.forEach(wl=>{

    g.position.set(wl.a[0],0,wl.a[1]);g.rotation.y=-Math.atan2(dz,dx);

  const fit=()=>{const a=(el.clientWidth||600)/(el.clientHeight||420);return 21*Math.min(1.9,Math.max(1,1.8/a))};let theta=-2.2,phi=0.92,rad=fit(),drag=null,touched=!auto;const tgt=new THREE.Vector3(6,0.6,4.5);
  const cv=R.domElement;

  cv.addEventListener('pointermove',e=>{if(!drag)return;theta+=(e.clientX-drag.x)*0.008;phi=Math.min(1.42,Math.max(0.2,phi-(e.clientY-drag.y)*0.006));drag={x:e.clientX,y:e.clientY}});

    <tr><td>Hidrossanitário</td><td class="xs">108 m² × ${brl(40)}/m² ${og('tabela')}</td><td class="num">${brl(4320)}</td></tr>

function gantt(){
  const T=tasks();let html=`<div class="gantt"><div class="g-head"><div></div>${DAYS.map(d=>`<div class="d ${d.i===TODAY?'today':''}">${d.dw}<b>${d.dd}</b></div>`).join('')}</div><div class="g-head"><div class="xs muted" style="padding:4px 0">Clima</div>${DAYS.map(d=>`<div class="w ${RAIN.includes(d.i)?'rain':''}">${d.i<9?ic(RAIN.includes(d.i)?'rain':d.i===5||d.i===8?'cloud':'sun','sm'):''}</div>`).join('')}</div>`;
  let g='';
  T.forEach(t=>{
    if(t.g!==g){g=t.g;html+=`<div class="g-row" style="border:0"><div class="g-grp">${g}</div></div>`}

}

    <div class="row wrap" style="padding:0 14px 14px"><button class="btn brand" data-act="toast" data-arg="Pedido preparado. Falta a sua autorização para enviar ao fornecedor.">Preparar pedido</button><span class="xs muted">Frete ausente nunca vira zero. A Pilar não compra sozinha.</span></div>
  </div></div>`;

/* ---- preços ---- */
V.precos=()=>{
  const UF=[['SP','Sinduscon-SP',2238.58,2162.78,'out/26','ok'],['PR','Sinduscon-PR',2105.12,2031.4,'out/26','ok'],['MG','Sinduscon-MG',2011.9,1942.33,'out/26','ok'],['RJ','Sinduscon-Rio',2189.07,2114.55,'set/26','wait'],['RS','Sinduscon-RS',2201.6,2125.02,'set/26','q'],['SC','Sinduscon-SC',2290.44,2210.9,'out/26','ok']];
  const st={ok:b('success','atualizado sozinho'),wait:b('neutral','aguardando publicação'),q:b('danger','quarentena')};
  return head({crumbs:'Configurações',title:'Referências de preço',sub:'CUB e SINAPI chegam sozinhos. Você só é avisado quando algo foge do normal.'})+`<div class="pc">
    <div class="grid g-side">
      <div class="card"><div style="padding:12px 14px 0" class="h3">${ic('chart','sm')}CUB R8-N por estado</div><table class="t cards"><thead><tr><th>UF</th><th>Fonte</th><th class="num">Sem desoneração</th><th class="num">Com desoneração</th><th>Competência</th><th>Estado</th></tr></thead><tbody>
      ${UF.map(u=>`<tr><td><b>${u[0]}</b></td><td class="xs">${u[1]}</td><td class="num">${brl(u[2])}</td><td class="num">${brl(u[3])}</td><td>${u[4]}</td><td>${st[u[5]]}</td></tr>`).join('')}
      </tbody></table><div class="xs muted" style="padding:10px 14px">Mostrando 6 de 27 estados. Cada estado tem a sua fonte; conferir as 27 URLs é o primeiro passo.</div></div>
      <div class="stack">
        <div class="card p"><h3>${ic('refresh','sm')}SINAPI out/2026</h3><div class="xs soft">Importado sozinho em 09/10 às 06:10.<br>4.881 insumos · 10.612 composições · 27 UFs · 3 regimes</div><div class="xs muted mt8">Arquivo bruto guardado com hash a1f3…9c. Importar de novo não duplica nada.</div></div>
        <div class="callout danger xs">${ic('alert','sm')}<div><b>CUB-RS em quarentena</b><br>A tabela de outubro veio em PDF digitalizado. A referência de setembro continua valendo, com aviso de defasagem nas estimativas do RS.<div class="row mt8"><button class="btn outline sm">Revisar</button></div></div></div>
        <div class="card p xs soft"><b>Como funciona</b><div class="mt8">Todo dia às 06:00 a Pilar confere se saiu publicação nova. Só baixa quando o arquivo muda. Valida mês, UF, regime, código e unidade antes de ativar. Célula vazia nunca vira zero.</div></div>
      </div>
    </div></div>`;
};

/* ---- portal do cliente ---- */
V.portal=()=>head({crumbs:'Visão do cliente',title:'Residência Alves',sub:'O que a Carla vê no portal. Só entra o que foi conferido e liberado.'})+`<div class="pc"><div style="max-width:760px">
  <div class="portal-hero"><div class="xs" style="opacity:.7">Semana de 02 a 08/11</div><div style="font-size:20px;font-weight:700;margin:4px 0">Sua obra avançou 6% esta semana</div><div class="row wrap">${b('neutral','38% concluída')}${b('neutral','entrega prevista 20/03/2027')}</div></div>
  <div class="card p mt"><h3>${ic('alert','sm')}Precisamos de você</h3><div class="row between wrap"><div><b>Escolher o piso da cozinha até 12/11</b><div class="xs soft">Para comprar a tempo da etapa de revestimentos.</div></div><button class="btn brand">Escolher piso</button></div></div>
  <div class="card p mt"><h3>${ic('check','sm')}O que avançou</h3>
    <div class="stack"><div><b>Paredes dos quartos e do banheiro levantadas</b><div class="xs muted">Conferido pela Eng. Marina em 03/11</div></div>
    ${S.campo==='confirmed'?'<div><b>Paredes da sala levantadas (3 de 4)</b><div class="xs muted">Conferido em 04/11 · a última parede espera material</div></div>':''}
    <div class="grid g3"><div class="photo"></div><div class="photo"></div><div class="photo"></div></div></div></div>
  <div class="card p mt"><h3>${ic('rain','sm')}Clima</h3><div class="xs soft">Chuva prevista para quinta. A equipe vai trabalhar nas instalações internas. A data de entrega não muda.</div></div>
  <div class="card mt"><div style="padding:12px 14px 0" class="h3">${ic('plan','sm')}Andamento na planta</div><div class="viewer" style="height:300px;border:0"><div class="plan2d">${plan2D({states:wallStatesCampo()})}</div></div></div>
  <div class="xs muted mt">O cliente não vê áudio, notas internas, valores restritos nem avaliação de fornecedor.</div>
</div></div>`;

/* ============ shell e render ============ */
function rail(){
  const items=SCREENS.map(s=>`<button class="ri desk ${S.screen===s.id?'on':''} ${s.id==='inicio'?'sep':''}" data-go="${s.id}" aria-label="${s.label}">${ic(s.icon)}${s.label}${s.dot?'<span class="dot"></span>':''}</button>`).join('');
  const mob=MOB.map(id=>{const s=SCREENS.find(x=>x.id===id);return `<button class="ri mob ${S.screen===id?'on':''}" data-go="${id}">${ic(s.icon)}${s.label}</button>`}).join('')+`<button class="ri mob ${!MOB.includes(S.screen)?'on':''}" data-act="sheet">${ic('menu')}Menu</button>`;
  return `<nav class="rail" aria-label="Módulos"><div class="logo"><span class="mk"><i style="height:12px"></i><i style="height:20px"></i><i style="height:16px"></i></span>pilar</div>${items}${mob}</nav>`;
}
function sheet(){
  if(!S.sheet)return '';
  return `<div class="sheet-bg" data-act="sheet"><div class="sheet" onclick="event.stopPropagation()">${SCREENS.map(s=>`<button data-go="${s.id}">${ic(s.icon)}${s.label}</button>`).join('')}</div></div>`;
}
function render(){
  dispose3D();
  const id=S.screen;
  let content;
  if(S.state!=='cheio'){const v=V[id]();const h=v.slice(0,v.indexOf('<div class="pc">'));content=h+`<div class="pc">${stateView(id)}</div>`}
  else content=V[id]();
  document.getElementById('app').innerHTML=`<div class="shell">${rail()}<main>${content}</main></div>${sheet()}`;
  document.querySelectorAll('#segDevice button').forEach(x=>x.classList.toggle('on',x.dataset.dev===S.device));
  document.querySelectorAll('#segState button').forEach(x=>x.classList.toggle('on',x.dataset.st===S.state));
  const g=document.querySelector('.gantt');if(g){g.style.setProperty('--g-name',getComputedStyle(g.querySelector('.g-head')).gridTemplateColumns.split(' ')[0])}
  if(S.state!=='cheio')return;
  requestAnimationFrame(after);
}
let SCAN3D=null,CAMPO3D=null;
function after(){
  const id=S.screen;
  if(id==='documentos'&&S.scanView==='3d'){const el=document.getElementById('scanViewer');if(el)SCAN3D=mount3D(el,{states:Object.fromEntries(PLAN.walls.map(w=>[w.id,'neutral']))})}
  if(id==='campo'&&S.campoView==='3d'){const el=document.getElementById('campoViewer');if(el){CAMPO3D=mount3D(el,{states:wallStatesCampo(),hlRoom:S.campo==='reported'?'sala':null});if(CAMPO3D&&S._animSala){SALA.forEach((w,i)=>CAMPO3D.setState(w,S._animSala,S._animSala==='reported',i*350));CAMPO3D.hl('sala');S._animSala=null}}}
  if(id==='obra'&&S.obraView==='3d'&&S.campoView==='3d'){const el=document.getElementById('obraViewer');if(el)mount3D(el,{states:wallStatesCampo()})}
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),3600)}
function go(id){S.screen=id;S.sheet=false;render();const d=document.getElementById('device');d.scrollTop=0;window.scrollTo({top:0})}

function act(a,arg,el){
  switch(a){
    case 'st':S.state=arg;render();break;
    case 'sheet':S.sheet=!S.sheet;render();break;
    case 'toast':toast(arg);break;
    case 'lead':S.lead=arg;S.waParsed=false;render();break;
    case 'comtab':S.comTab=arg;render();break;
    case 'waparse':S.waParsed=true;render();break;
    case 'prop':S.prop=+arg;if(+arg>1)S.proposalReplied=true;render();break;
    case 'replied':S.proposalReplied=true;render();toast('Resposta registrada no briefing, com a origem "da conversa".');break;
    case 'tpl':S.tpl=arg;render();break;
    case 'scanview':S.scanView=arg;render();break;
    case 'scan':
      S.scan='reading';S.scanStep=0;render();
      const tick=()=>{S.scanStep++;if(S.scanStep>=SCAN_STEPS.length){S.scan='done';S.scanView='2d';render();toast('Planta lida. Confira os ambientes antes de usar.');return}render();setTimeout(tick,850)};
      setTimeout(tick,850);break;
    case 'obraview':S.obraView=arg;render();break;
    case 'campoview':S.campoView=arg;render();break;
    case 'clima':S.clima=true;render();toast('Plano v14 aplicado. Equipe avisada no Pilar Campo.');break;
    case 'rec':
      S.campo='recording';render();
      setTimeout(()=>{S.campo='processing';render();setTimeout(()=>{S.campo='reported';
        if(CAMPO3D&&S.campoView==='3d'){S._animSala='reported'}
        render();toast('Relato ligado à sala. Paredes marcadas como relatadas.')},1600)},2600);break;
    case 'confirm':S.campo='confirmed';if(S.campoView==='3d')S._animSala='done';render();toast('Conferido. Pode ir para o relatório do cliente.');break;
    case 'frete':setTimeout(()=>{S.frete=true;render();toast('Frete recebido: R$ 220. Comparação atualizada.')},1500);break;
  }
}
document.addEventListener('click',e=>{
  const dv=e.target.closest('[data-dev]');if(dv){S.device=dv.dataset.dev;document.getElementById('device').className=S.device;render();return}
  const st=e.target.closest('[data-st]');if(st){S.state=st.dataset.st;render();return}
  const t=e.target.closest('[data-go],[data-act]');if(!t)return;
  if(t.dataset.act)act(t.dataset.act,t.dataset.arg,t);
  if(t.dataset.go)go(t.dataset.go);
});
render();
</script>
